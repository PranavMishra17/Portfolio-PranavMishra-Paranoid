<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Room — Elevation A — Pranav Mishra</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600&family=Spectral:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   THE ROOM — one wall, drawn as a measured architectural elevation.
   Line weights are hierarchical (envelope 2.4 / object 1.5 / detail 1
   / annotation 0.7) the way a real drawing's are. Nothing is seen from
   above: no desk tops, no papers lying flat, no three-quarter view.
   Every object is something you can see face-on from across the room.
   Three colours only: paper, ink, ochre. Ochre is never decoration —
   it means live, accepted, or awarded.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --paper:#E4E2D9;      /* the sheet, and the wall */
  --paper-2:#F1F0E9;  /* card and sheet stock, solid */
  --fill-1:#D7D4C8;     /* flat fill: board, door panels */
  --fill-2:#C7C4B5;     /* flat fill: shadowed faces */
  --ink:#232A2C;        /* all line work and all lettering */
  --ink-2:#5D6664;      /* annotation, dimensions */
  --ink-3:#8B9291;      /* dotted leaders, hatch */
  --ochre:#8A5E13;      /* status lettering */
  --ochre-f:#BC8628;  /* status fills and pins */
  --wash:rgba(228,226,217,.80);
  --nar:'Archivo Narrow',Arial Narrow,Helvetica,sans-serif;
  --ser:'Spectral',Georgia,serif;
}
:root[data-lights="off"]{
  --paper:#14232B;
  --paper-2:#1D3140;
  --fill-1:#1A2B34;
  --fill-2:#223945;
  --ink:#D2DFE3;
  --ink-2:#93A7AE;
  --ink-3:#5D7280;
  --ochre:#E8B460;
  --ochre-f:#D9A24B;
  --wash:rgba(20,35,43,.84);
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--ser);
  transition:background 420ms ease;
  min-height:100%;
}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
a{color:inherit}
:focus-visible{outline:2px solid var(--ochre-f);outline-offset:3px}

/* ── the sheet ───────────────────────────────────────────── */
#sheetwrap{overflow-x:auto;overflow-y:hidden;padding:10px}
#stage{
  position:relative;width:100%;max-width:1480px;min-width:1300px;
  margin:0 auto;aspect-ratio:1480/880;
}
#lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#ov{position:absolute;inset:0;font-family:var(--nar);font-size:16px}

/* every interactive object in the room */
.o{
  position:absolute;box-sizing:border-box;
  transition:outline-color 150ms ease, transform 180ms cubic-bezier(.2,.9,.25,1);
  outline:2px solid transparent;outline-offset:2px;
}
.o:hover,.o:focus-visible{outline-color:var(--ochre-f)}
.o:hover{transform:translateY(-1.5px)}

/* the name card */
#about{
  background:var(--paper-2);border:1.5px solid var(--ink);
  padding:.62em .78em .7em;display:flex;flex-direction:column;
  box-shadow:0 2px 0 rgba(0,0,0,.10);
}
#about .who{
  font-size:.78em;letter-spacing:.09em;color:var(--ink-2);
  text-transform:uppercase;margin-bottom:.5em;
  border-bottom:1px solid var(--ink-3);padding-bottom:.34em;
}
#about .say{
  font-family:var(--ser);font-size:clamp(15px,1.16em,16px);line-height:1.56;
  color:var(--ink);max-width:64ch;
}
#about .say b{font-weight:500}
#about .sch{
  margin-top:auto;padding-top:.5em;font-size:.74em;letter-spacing:.08em;
  color:var(--ink-2);text-transform:uppercase;
}

/* four ID badges */
.badge{
  background:var(--paper-2);border:1.4px solid var(--ink);
  padding:.34em .38em;display:flex;flex-direction:column;
  box-shadow:0 2px 0 rgba(0,0,0,.09);
}
.badge .co{font-size:.78em;font-weight:600;letter-spacing:.045em;line-height:1.14;text-transform:uppercase}
.badge .ro{font-size:.66em;line-height:1.2;color:var(--ink-2);margin-top:.3em}
.badge .pl{font-size:.64em;line-height:1.2;color:var(--ink-2);margin-top:.14em}
.badge .yr{
  margin-top:auto;font-size:.8em;font-weight:500;letter-spacing:.03em;
  border-top:1px solid var(--ink-3);padding-top:.24em;
}
.badge .hole{
  position:absolute;left:50%;top:.34em;transform:translateX(-50%);
  width:24%;height:.2em;background:var(--fill-2);border:1px solid var(--ink-3);
}

/* nine pinned prints */
.print{padding:0;border:0;background:none}
.print .im{
  width:100%;aspect-ratio:16/9;object-fit:cover;
  border:1.3px solid var(--ink);background:var(--fill-2);
  filter:saturate(.84) contrast(.96);
}
:root[data-lights="off"] .print .im{filter:saturate(.8) brightness(.86)}
.print .cap{
  font-size:.68em;letter-spacing:.055em;text-transform:uppercase;
  margin-top:.34em;line-height:1.16;color:var(--ink);
}
.print .cap i{font-style:normal;color:var(--ochre);letter-spacing:.05em}

/* three papers */
.paper-s{
  background:var(--paper-2);border:1.4px solid var(--ink);
  padding:.4em .42em;display:flex;flex-direction:column;
}
.paper-s.prep{border-style:dashed;background:none}
.paper-s .stamp{
  font-size:.62em;letter-spacing:.075em;text-transform:uppercase;
  text-align:center;padding:.2em 0;margin-bottom:.5em;line-height:1.1;
}
.paper-s .stamp.acc{background:var(--ochre-f);color:#1B1508;font-weight:600}
:root[data-lights="off"] .paper-s .stamp.acc{color:#14232B}
.paper-s .stamp.rev{border:1px solid var(--ink-2);color:var(--ink-2)}
.paper-s .stamp.non{border:1px dashed var(--ink-3);color:var(--ink-3)}
.paper-s .ti{font-size:.7em;line-height:1.2;letter-spacing:.03em;text-transform:uppercase;font-weight:500}
.paper-s .ve{font-size:.66em;line-height:1.22;color:var(--ink-2);margin-top:.42em}
.paper-s .fg{
  margin-top:auto;font-size:.74em;font-weight:500;
  border-top:1px solid var(--ink-3);padding-top:.26em;letter-spacing:.02em;
}

/* two framed awards */
.frame{border:1.6px solid var(--ink);background:var(--paper-2);padding:.16em}
.frame img{width:100%;height:100%;object-fit:cover;border:1px solid var(--ink-3);filter:saturate(.84) contrast(.96)}
:root[data-lights="off"] .frame img{filter:saturate(.8) brightness(.86)}

/* the schedule of measured values */
#sched{
  background:var(--paper-2);border:1.5px solid var(--ink);
  padding:.55em .62em .5em;display:flex;flex-direction:column;
  box-shadow:0 2px 0 rgba(0,0,0,.10);
}
#sched .h{
  font-size:.74em;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);
  border-bottom:1.2px solid var(--ink);padding-bottom:.3em;margin-bottom:.42em;
}
#sched .r{display:flex;align-items:baseline;gap:.3em;font-size:.84em;line-height:1.86}
#sched .r .k{white-space:nowrap;letter-spacing:.035em;text-transform:uppercase;color:var(--ink-2)}
#sched .r .d{flex:1;border-bottom:1px dotted var(--ink-3);transform:translateY(-.22em)}
#sched .r .v{white-space:nowrap;font-weight:600;letter-spacing:.01em}
#sched .f{margin-top:auto;padding-top:.4em;font-size:.63em;color:var(--ink-2);letter-spacing:.05em;text-transform:uppercase}

/* the bookshelf hit area */
#shelfbtn{background:none;border:1px solid transparent}
#shelfbtn:hover,#shelfbtn:focus-visible{border-color:transparent}

/* the light switch — deliberately unannotated */
#switch{background:none;border:0}
#switch::after{content:"";position:absolute;inset:-14px}

/* margin links */
#margin-links{
  position:absolute;font-family:var(--nar);display:flex;gap:1.6em;
  font-size:.82em;letter-spacing:.075em;text-transform:uppercase;
}
#margin-links a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--ink-3);padding-bottom:1px}
#margin-links a:hover{color:var(--ink);border-bottom-color:var(--ink)}

/* ── the pinned sheet that opens over the wall ────────────── */
#wash{position:absolute;inset:0;background:var(--wash);z-index:40}
#pinsheet{
  position:absolute;z-index:41;
  left:25%;right:4%;top:3.2%;bottom:3.2%;
  background:var(--paper-2);border:1.6px solid var(--ink);
  box-shadow:0 22px 54px rgba(20,26,28,.30);
  overflow-y:auto;overscroll-behavior:contain;
  padding:30px 34px 34px;
}
:root[data-lights="off"] #pinsheet{box-shadow:0 22px 54px rgba(0,0,0,.55)}
#pinsheet::before,#pinsheet::after{
  content:"";position:absolute;top:11px;width:9px;height:9px;border-radius:50%;
  background:var(--ochre-f);border:1px solid var(--ink);
}
#pinsheet::before{left:16px}
#pinsheet::after{right:16px}
#close{
  position:absolute;top:14px;right:34px;
  font-family:var(--nar);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-2);border:1px solid var(--ink-3);padding:4px 9px;
}
#close:hover{color:var(--ink);border-color:var(--ink)}
.ps{max-width:640px}
.ps .kick{font-family:var(--nar);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-bottom:14px}
.ps h2{font-family:var(--ser);font-weight:500;font-size:27px;line-height:1.2;letter-spacing:-.01em;margin-bottom:6px;max-width:26ch}
.ps .meta{font-family:var(--nar);font-size:13px;letter-spacing:.05em;color:var(--ink-2);margin-bottom:18px}
.ps figure{margin:0 0 20px}
.ps figure img{width:100%;aspect-ratio:16/9;object-fit:cover;border:1.3px solid var(--ink);background:var(--fill-2)}
.ps figure.sm{max-width:360px}
.ps figure.sm img{aspect-ratio:1/1}
.ps .duo{display:flex;gap:14px;margin:0 0 20px;flex-wrap:wrap}
.ps .duo figure{flex:1 1 200px;margin:0}
.ps .duo figure img{aspect-ratio:4/3}
.ps p{font-size:15.5px;line-height:1.62;max-width:66ch;margin-bottom:.85em;color:var(--ink)}
.ps p:last-of-type{margin-bottom:0}
.ps .tab{margin:22px 0 4px;border-top:1.2px solid var(--ink);padding-top:8px}
.ps .tab .th{font-family:var(--nar);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.ps .tab .r{display:flex;align-items:baseline;gap:.4em;font-family:var(--nar);font-size:14px;line-height:2.05}
.ps .tab .r .k{letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.ps .tab .r .d{flex:1;border-bottom:1px dotted var(--ink-3);transform:translateY(-.24em)}
.ps .tab .r .v{font-weight:600;white-space:nowrap}
.ps .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin:20px 0 12px}
.ps .slot{border:1px dashed var(--ink-3);padding:9px 11px}
.ps .slot span{display:block;font-family:var(--nar);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:3px}
.ps .slot b{font-weight:400;font-size:16px;color:var(--ink-3)}
.ps .note{font-size:14px;font-style:italic;color:var(--ink-2);max-width:52ch}
.ps .lk{display:flex;gap:1.5rem;flex-wrap:wrap;margin-top:20px}
.ps .lk a{
  font-family:var(--nar);font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;
  text-decoration:none;border-bottom:1.4px solid var(--ochre-f);padding-bottom:2px;
}
.ps .lk a:hover{border-bottom-width:2.4px}

/* ── the sheet index: the mobile interface ────────────────── */
#index{display:none;padding:0 16px 40px;max-width:640px;margin:0 auto}
#index h2{
  font-family:var(--nar);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-2);border-bottom:1.4px solid var(--ink);padding-bottom:7px;margin:22px 0 4px;
}
.ix{border-bottom:1px solid var(--ink-3);padding:15px 0 16px}
.ix .nm{font-family:var(--nar);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.ix .nt{font-family:var(--nar);font-size:12.5px;letter-spacing:.05em;color:var(--ink-2);margin-top:3px}
.ix .say{font-family:var(--ser);font-size:15.5px;line-height:1.58;margin-top:10px}
.ix .keys{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.ix .keys button{
  font-family:var(--nar);font-size:13px;letter-spacing:.055em;text-transform:uppercase;
  border:1.2px solid var(--ink);padding:8px 11px;min-height:38px;
  background:var(--paper-2);
}
.ix .keys button:hover{border-color:var(--ochre-f)}
.ix .keys button i{font-style:normal;color:var(--ochre)}

@media (max-width:860px){
  #sheetwrap{overflow:hidden;padding:10px 10px 0}
  #stage{min-width:0}
  #ov{pointer-events:none}
  #ov #switch{pointer-events:auto}
  /* Below 860 the drawing is a quarter of full size, so its lettering
     would be mush. It becomes a key drawing — line work, the nine prints
     and the two framed awards — and the sheet index below carries the
     words at full reading size. */
  #callouts,#margin-links,#about .who,#about .say,#about .sch,
  #sched .h,#sched .r,#sched .f,
  .badge .co,.badge .ro,.badge .pl,.badge .yr,.badge .hole,
  .paper-s .stamp,.paper-s .ti,.paper-s .ve,.paper-s .fg,
  .print .cap{display:none}
  .badge,.paper-s,#about,#sched{padding:0}
  #index{display:block}
  #pinsheet{
    position:fixed;left:8px;right:8px;top:8px;bottom:8px;
    padding:26px 20px 30px;
  }
  #wash{position:fixed}
  #close{right:20px}
  .ps h2{font-size:23px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body>

<div id="sheetwrap">
  <div id="stage">

  <!-- ══ ALL LINE WORK. viewBox 1480 × 880. Wall x36→1444, ceiling y140,
          finished floor y744. 1 px ≈ 4.47 mm, so the wall is 2700 mm. ══ -->
  <svg id="lines" viewBox="0 0 1480 880" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <g fill="none" stroke="currentColor" vector-effect="non-scaling-stroke"
       stroke-linecap="square" style="color:var(--ink)">

      <!-- sheet border -->
      <rect x="10" y="10" width="1460" height="860" stroke-width="1.1" style="color:var(--ink-2)"/>

      <!-- ── floor hatch, drawn first so objects sit over it ── -->
      <g stroke-width=".7" style="color:var(--ink-3)">
        <line x1="36" y1="744" x2="1444" y2="744"/>
        <path d="M36 756 44 744 M60 756 68 744 M84 756 92 744 M108 756 116 744 M132 756 140 744 M156 756 164 744 M180 756 188 744 M204 756 212 744 M228 756 236 744 M252 756 260 744 M276 756 284 744 M300 756 308 744 M324 756 332 744 M348 756 356 744 M372 756 380 744 M396 756 404 744 M420 756 428 744 M444 756 452 744 M468 756 476 744 M492 756 500 744 M516 756 524 744 M540 756 548 744 M564 756 572 744 M588 756 596 744 M612 756 620 744 M636 756 644 744 M660 756 668 744 M684 756 692 744 M708 756 716 744 M732 756 740 744 M756 756 764 744 M780 756 788 744 M804 756 812 744 M828 756 836 744 M852 756 860 744 M876 756 884 744 M900 756 908 744 M924 756 932 744 M948 756 956 744 M972 756 980 744 M996 756 1004 744 M1020 756 1028 744 M1044 756 1052 744 M1068 756 1076 744 M1092 756 1100 744 M1116 756 1124 744 M1140 756 1148 744 M1164 756 1172 744 M1188 756 1196 744 M1212 756 1220 744 M1236 756 1244 744 M1260 756 1268 744 M1284 756 1292 744 M1308 756 1316 744 M1332 756 1340 744 M1356 756 1364 744 M1380 756 1388 744 M1404 756 1412 744 M1428 756 1436 744"/>
      </g>

      <!-- ── room envelope: the heaviest line on the sheet ── -->
      <path d="M36 140 H1444 M36 140 V744 M1444 140 V744" stroke-width="2.4"/>
      <!-- skirting, interrupted by the door -->
      <line x1="204" y1="730" x2="1444" y2="730" stroke-width="1"/>

      <!-- ── DOOR. 715 × 2100. Gives the room its scale. ── -->
      <g stroke-width="1.5">
        <rect x="44" y="274" width="160" height="470" fill="var(--fill-1)"/>
        <rect x="56" y="292" width="136" height="188" stroke-width="1" fill="none"/>
        <rect x="56" y="494" width="136" height="234" stroke-width="1" fill="none"/>
        <circle cx="184" cy="512" r="5" fill="var(--ink)"/>
        <line x1="176" y1="498" x2="176" y2="526" stroke-width="1"/>
      </g>

      <!-- ── LIGHT SWITCH, 1030 a.f.f. No callout. ── -->
      <g stroke-width="1.2">
        <rect x="222" y="498" width="26" height="32" fill="var(--paper-2)"/>
        <rect x="230" y="506" width="10" height="16" fill="var(--fill-2)"/>
        <line id="sw-on" x1="230" y1="512" x2="240" y2="512" stroke-width="1"/>
      </g>

      <!-- ── HIGH SHELF above the door: the awards ── -->
      <g stroke-width="1.5">
        <line x1="38" y1="236" x2="210" y2="236" stroke-width="2.2"/>
        <path d="M58 236 V250 M190 236 V250" stroke-width="1"/>
      </g>

      <!-- ── HOOK RAIL, 1080 a.f.f., and four lanyards ── -->
      <g stroke-width="1.5">
        <rect x="272" y="526" width="456" height="6" fill="var(--fill-2)"/>
        <path d="M330 532 V556 M443 532 V562 M556 532 V552 M669 532 V560" stroke-width="1"/>
        <rect x="321" y="556" width="18" height="10" fill="var(--paper-2)" stroke-width="1"/>
        <rect x="434" y="562" width="18" height="10" fill="var(--paper-2)" stroke-width="1"/>
        <rect x="547" y="552" width="18" height="10" fill="var(--paper-2)" stroke-width="1"/>
        <rect x="660" y="560" width="18" height="10" fill="var(--paper-2)" stroke-width="1"/>
      </g>

      <!-- ── BULLDOG CLIP RAIL, and three clips ── -->
      <g stroke-width="1.5">
        <line x1="746" y1="180" x2="1014" y2="180" stroke-width="2.2"/>
        <rect x="776" y="182" width="22" height="12" fill="var(--fill-2)" stroke-width="1"/>
        <rect x="869" y="182" width="22" height="12" fill="var(--fill-2)" stroke-width="1"/>
        <rect x="962" y="182" width="22" height="12" fill="var(--fill-2)" stroke-width="1"/>
      </g>

      <!-- ── PIN BOARD, frame and cork ── -->
      <g stroke-width="1.6">
        <rect x="1050" y="172" width="390" height="340" fill="var(--fill-2)"/>
        <rect x="1062" y="184" width="366" height="316" fill="var(--fill-1)" stroke-width="1"/>
      </g>

      <!-- ── BOOK SHELF, 750 a.f.f. Six slots: three marked, three empty. ── -->
      <g stroke-width="1.5">
        <line x1="1046" y1="700" x2="1442" y2="700" stroke-width="2.2"/>
        <path d="M1070 700 V716 M1418 700 V716" stroke-width="1"/>
        <rect x="1050" y="610" width="58" height="88" stroke-width="1.2" stroke-dasharray="5 4" fill="none"/>
        <rect x="1116" y="600" width="58" height="98" stroke-width="1.2" stroke-dasharray="5 4" fill="none"/>
        <rect x="1248" y="606" width="58" height="92" stroke-width="1.2" stroke-dasharray="5 4" fill="none"/>
      </g>
      <g font-family="Archivo Narrow, sans-serif" font-size="11" letter-spacing="2.2"
         fill="var(--ink-3)" stroke="none">
        <text transform="translate(1084,690) rotate(-90)">BOOKS</text>
        <text transform="translate(1150,690) rotate(-90)">FILM</text>
        <text transform="translate(1282,690) rotate(-90)">GAMES</text>
      </g>

      <!-- ═══ DIMENSIONS. An architectural drawing is full of numbers;
               these are the room's, and the badges' span is one of his. ═══ -->
      <g stroke-width=".8" style="color:var(--ink-2)">
        <!-- overall wall width -->
        <path d="M36 748 V782 M1444 748 V782" stroke-width=".7" style="color:var(--ink-3)"/>
        <line x1="36" y1="770" x2="1444" y2="770"/>
        <path d="M30 776 42 764 M1438 776 1450 764"/>
        <!-- badge span: his four jobs, measured -->
        <path d="M280 702 V726 M720 702 V726" stroke-width=".7" style="color:var(--ink-3)"/>
        <line x1="280" y1="716" x2="720" y2="716"/>
        <path d="M274 722 286 710 M714 722 726 710"/>
        <!-- eye level, to the centre of the name card -->
        <line x1="262" y1="406" x2="262" y2="744"/>
        <path d="M256 412 268 400 M256 738 268 726"/>
        <line x1="268" y1="406" x2="280" y2="406" stroke-width=".7" style="color:var(--ink-3)"/>
        <!-- wall height -->
        <line x1="1458" y1="140" x2="1458" y2="744"/>
        <path d="M1452 146 1464 134 M1452 738 1464 726"/>
      </g>
      <g font-family="Archivo Narrow, sans-serif" fill="var(--ink-2)" stroke="none"
         font-size="12.5" letter-spacing="1.1">

/* ─────────────────────────────────────────────────────────────
   THE PINNED SHEET. Long copy will not fit inside a room, so it
   does not try: it pins over one region of the wall on a solid
   ground, and the room dims behind it. No body text over artwork.
   ───────────────────────────────────────────────────────────── */
var wash = document.getElementById('wash');
var sheet = document.getElementById('pinsheet');
var psb = document.getElementById('ps-body');
var lastFocus = null;

function open(key){
  var d = C[key]; if(!d) return;
  lastFocus = document.activeElement;
  var h = '<p class="kick">'+d.kick+'</p><h2 id="ps-title">'+d.t+'</h2>';
  if(d.meta) h += '<p class="meta">'+d.meta+'</p>';
  if(d.img)  h += '<figure'+(d.small?' class="sm"':'')+'><img src="'+IMG+d.img+'" alt="'+d.t+'"></figure>';
  if(d.duo)  h += '<div class="duo">'+d.duo.map(function(s){
                    return '<figure><img src="'+IMG+s+'" alt=""></figure>'; }).join('')+'</div>';
  h += d.p.map(function(x){ return '<p>'+x+'</p>'; }).join('');
  if(d.tab){
    h += '<div class="tab"><div class="th">'+d.tab[0]+'</div>' + d.tab[1].map(function(r){
      return '<div class="r"><span class="k">'+r[0]+'</span><span class="d"></span><span class="v">'+r[1]+'</span></div>';
    }).join('') + '</div>';
  }
  if(d.p2) h += d.p2.map(function(x){ return '<p style="margin-top:1em">'+x+'</p>'; }).join('');
  if(d.slots){
    h += '<div class="slots">' + d.slots.map(function(s){
      return '<div class="slot"><span>'+s[0]+'</span><b>'+s[1]+'</b></div>'; }).join('') + '</div>';
  }
  if(d.note) h += '<p class="note">'+d.note+'</p>';
  if(d.lk){
    h += '<p class="lk">' + d.lk.map(function(l){
      return '<a href="'+l[1]+'" target="_blank" rel="noopener">'+l[0]+'</a>'; }).join('') + '</p>';
  }
  psb.innerHTML = h;
  wash.hidden = false; sheet.hidden = false; sheet.scrollTop = 0;

  if(!REDUCED){
    /* one overshoot, one settle — the sheet is pushed onto the pins.
       framer-motion equivalent at this call site:
       { type:'spring', stiffness: 340, damping: 27, mass: 1.2 } */
    sheet.animate(
      [{transform:'translateY(20px) scale(.988)',opacity:0},
       {transform:'translateY(-5px) scale(1.003)',opacity:1,offset:.6},
       {transform:'none',opacity:1}],
      {duration:400,easing:'cubic-bezier(.2,.85,.25,1)'});
    wash.animate([{opacity:0},{opacity:1}],{duration:220,easing:'ease-out'});
  }
  document.getElementById('close').focus();
}
function shut(){
  if(sheet.hidden) return;
  wash.hidden = true; sheet.hidden = true;
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
document.getElementById('close').addEventListener('click',shut);
wash.addEventListener('click',shut);
document.addEventListener('keydown',function(e){ if(e.key==='Escape') shut(); });
sheet.addEventListener('keydown',function(e){
  if(e.key!=='Tab') return;
  var f = sheet.querySelectorAll('button,a[href]');
  if(!f.length) return;
  var first=f[0], last=f[f.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
});

/* ─────────────────────────────────────────────────────────────
   THE SHEET INDEX. Below 860 px the drawing is a quarter scale,
   so its lettering would be unreadable — the index takes over
   as the interface. It is the same seven callouts, set as type.
   ───────────────────────────────────────────────────────────── */
var IX = [
  ['Name card, pinned','1 500 above finished floor',
   'I build the parts of AI systems that have to be right: how fast they answer, and whether they are telling the truth. Founding engineer at Alfred_ in New York, on an assistant five thousand people use.',
   [['Read the card','about',0]]],
  ['ID badges, hook rail','4 no.  earliest first',null,
   [['Bipolar Factory 2023','bipolar',0],['V-ARE Labs 2024','vare',0],['WheelPrice 2025','wheel',0],['Alfred_ 2026','alfred',0]]],
  ['Pin board, project prints','9 no.',null,
   PRINTS.map(function(p){ return [p[1],p[0],p[3]]; })],
  ['Paper rack','3 no.  1 accepted',null,
   [['Retrieval, accepted','paper1',1],['TeamMedAgents, under review','paper2',0],['Small models, in preparation','paper3',0]]],
  ['Schedule of measured values','8 entries on the sheet',null,
   [['Read the schedule','sched',0]]],
  ['Award shelf','2 no.  2023, 2024',null,
   [['MIT XR and HINT 5.0','awards',1]]],
  ['Book shelf','3 slots marked, 3 empty. Placeholders.',null,
   [['Open the shelf','shelf',0]]]
];
var ix = document.getElementById('index');
var ixh = '<h2>Sheet index, elevation A</h2>';
IX.forEach(function(g){
  ixh += '<div class="ix"><div class="nm">'+g[0]+'</div><div class="nt">'+g[1]+'</div>' +
    (g[2] ? '<div class="say">'+g[2]+'</div>' : '') +
    '<div class="keys">' + g[3].map(function(k){
      return '<button type="button" data-k="'+k[1]+'">'+k[0]+(k[2]===2?' <i>live</i>':(k[2]===1?' <i>*</i>':''))+'</button>';
    }).join('') + '</div></div>';
});
ix.innerHTML = ixh;
ix.addEventListener('click',function(e){
  var b = e.target.closest('button[data-k]'); if(b) open(b.getAttribute('data-k'));
});

/* Overlay lettering scales with the drawing so it never overflows its
   box; clamped at 0.8 so it never drops below annotation legibility.
   Body copy on the name card is clamped in CSS to 15 px minimum.
   Nothing here is gated on rAF, load or IntersectionObserver — the
   drawing is in the DOM at first paint and this only sets a size. */
function fit(){
  var w = document.getElementById('stage').getBoundingClientRect().width || 1300;
  ov.style.fontSize = (Math.max(0.87, Math.min(1, w / W)) * 13).toFixed(2) + 'px';
}
fit();
addEventListener('resize',fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(document.getElementById('stage'));
setTimeout(fit,120);
setTimeout(fit,600);
setTimeout(fit,1600);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>

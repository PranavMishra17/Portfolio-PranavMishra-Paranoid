<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Window — Pranav Mishra</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..400&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#3b3630;
  --wall-lit:#4a443c;
  --desk:#2b2620;
  --paper:#e9e4d9;
  --ink:#221f1b;
  --ink-soft:#5c554c;
  --rule:#c8c0b1;
  --brass:#c2924a;
  --deep:#2f4858;
  --prose:'Newsreader',Georgia,serif;
  --ui:'Karla',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--wall);color:var(--paper);font-family:var(--ui);
  overflow:hidden;transition:background 900ms ease;
}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}

#scene{position:fixed;inset:0;display:block}
svg{width:100%;height:100%;display:block}

/* things you can pick up: visibly labelled at rest, not hover-only */
.hot{cursor:pointer}
.hot .plate{transition:opacity 180ms ease}
.hot:hover .lift,.hot:focus-visible .lift{transform:translateY(-3px)}
.lift{transition:transform 220ms cubic-bezier(.2,.9,.25,1)}
.hot .label{
  font-family:var(--ui);font-size:13px;font-weight:500;fill:#e6ded0;
  paint-order:stroke;stroke:rgba(20,17,14,.75);stroke-width:3.5px;stroke-linejoin:round;
}
.hot .label.done{fill:#a99c88}
.tick{fill:var(--brass);opacity:0}
.hot.seen .tick{opacity:1}

/* the sheet of paper that lands on the desk */
#sheet{
  position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(760px,calc(100vw - 40px));max-height:min(78vh,760px);
  background:var(--paper);color:var(--ink);border-radius:2px;
  box-shadow:0 40px 90px rgba(0,0,0,.62),0 2px 0 rgba(255,255,255,.25) inset;
  display:none;overflow:hidden;
}
#sheet.on{display:flex;flex-direction:column}
#sheetHead{
  display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  padding:clamp(20px,3vw,30px) clamp(20px,3.4vw,36px) 0;
}
#sheetHead h2{font-family:var(--prose);font-weight:400;font-size:clamp(24px,3.2vw,34px);line-height:1.1}
#shut{font-size:13px;color:var(--ink-soft);border-bottom:1px solid var(--rule);padding-bottom:2px;flex:none}
#sheetBody{
  padding:clamp(14px,2vw,20px) clamp(20px,3.4vw,36px) clamp(24px,3.4vw,34px);
  overflow-y:auto;overscroll-behavior:contain;
}
#sheetBody p{font-size:15.5px;line-height:1.62;max-width:66ch;margin-bottom:.85rem;color:var(--ink)}
#sheetBody p.q{color:var(--ink-soft);font-size:14.5px}
#sheetBody a{color:var(--deep);text-decoration:none;border-bottom:1px solid rgba(47,72,88,.35);padding-bottom:1px}
#sheetBody a:hover{border-bottom-color:var(--deep)}

.entry{padding:1.05rem 0;border-top:1px solid var(--rule)}
.entry:first-of-type{border-top:0;padding-top:.2rem}
.entry h3{font-family:var(--prose);font-weight:500;font-size:19px;line-height:1.25;margin-bottom:.15rem}
.entry .when{font-size:13px;color:var(--ink-soft);margin-bottom:.5rem}
.entry p{margin-bottom:.5rem}
.entry .lk{display:flex;gap:1.3rem;flex-wrap:wrap;font-size:13.5px;margin-top:.35rem}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-top:.4rem}
.card{background:#ded8cb;border-radius:2px;overflow:hidden}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;background:#cfc7b6}
.card .cap{padding:.6rem .7rem .75rem}
.card h4{font-family:var(--prose);font-weight:500;font-size:16px;line-height:1.2;margin-bottom:.2rem}
.card p{font-size:13.5px;line-height:1.5;color:var(--ink-soft);margin:0}
.card .lk{display:flex;gap:1rem;font-size:13px;margin-top:.45rem;flex-wrap:wrap}
.live{display:inline-block;font-size:12px;color:#3f6b45;border:1px solid #9fb99f;border-radius:2px;padding:0 .35rem;margin-left:.4rem;vertical-align:1px}

.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:.5rem}
.slot{border:1px dashed var(--rule);border-radius:2px;padding:.7rem .8rem}
.slot span{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:.2rem}
.slot b{font-family:var(--prose);font-weight:400;font-size:15.5px}
.note{font-size:13px;color:var(--ink-soft);margin-top:1rem;font-style:italic}

#veil{position:fixed;inset:0;z-index:15;background:rgba(12,10,8,.5);display:none}
#veil.on{display:block}

.hint{
  position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:12;
  font-size:13px;color:rgba(233,228,217,.6);pointer-events:none;transition:opacity 400ms;
}

/* small screens: keep the window, list the objects honestly */
#mobile{display:none}
@media (max-width:700px){
  body{overflow-y:auto}
  #scene{position:relative;height:44vh;inset:auto}
  #mobile{display:block;padding:18px 18px 60px;background:var(--wall)}
  #mobile h1{font-family:var(--prose);font-weight:400;font-size:26px;margin-bottom:.2rem}
  #mobile .sub{font-size:14.5px;color:#bdb3a2;margin-bottom:1.1rem;line-height:1.5}
  #mobile button{
    display:block;width:100%;text-align:left;padding:.9rem 0;
    border-bottom:1px solid rgba(233,228,217,.16);font-size:16px;
  }
  #mobile button span{display:block;font-size:13px;color:#a99c88;margin-top:.15rem}
  #sheet{width:calc(100vw - 24px);max-height:86vh}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>

<div id="mobile">
  <h1>Pranav Pushkar Mishra</h1>
  <p class="sub">Founding LLM Engineer at Alfred_, in New York. This is a desk in front of a window. Pick something up.</p>
  <div id="mobList"></div>

<script>
(function(){
  'use strict';
  var REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var IMG = '/portfolio/public/assets/images/';

  var PROJECTS = [
    { t:'Stellarium', img:'game_design/stellarium.png',
      d:'A hundred and seven thousand astronomical objects, rendered in CAVE2, a room whose walls are screens. Holding frame rates while that many objects are up and a person is turning their head was the hard part.',
      lk:[['Watch it run','https://youtu.be/EX0c-6E8iNc']] },
    { t:'SnAIder-Cut', img:'game_design/snaider.png', award:1,
      d:'Say what you want changed, and the augmented room changes around you. Won the MIT XR hackathon in 2024.',
      lk:[['Watch it run','https://youtu.be/CZtGmnGYKp8']] },
    { t:'EQUITY', img:'game_design/equity.png',
      d:'A virtual patient in Unreal Engine 5, built so researchers can study how doctors treat people differently.',
      lk:[['Watch it run','https://youtu.be/WO2vVaD8WoE'],['Code','https://github.com/PranavMishra17/EQUITY-VirtualPatient-UE5']] },
    { t:'Virtual Van Gogh', img:'game_design/van%20gogh.jpg', award:1,
      d:'A museum you can walk through, where the paintings are on a chain. First place at HINT 5.0.',
      lk:[['Watch it run','https://youtu.be/rz_NiIj-dic']] },
    { t:'SnakeAI-MLOps', img:'ai_ml/snake.png', live:1,
      d:'Four ways of learning the same game, racing each other. Q-learning, DQN, PPO and actor-critic, in C++ and PyTorch.',
      lk:[['Play it','https://pranavmishra17.github.io/SnakeAI-MLOps/'],['Code','https://github.com/PranavMishra17/SnakeAI-MLOps']] },
    { t:'AI Mafia', img:'game_design/mafia.png',
      d:'Language models playing a game about lying to each other. Nobody scripted the betrayals.',
      lk:[['Code','https://github.com/PranavMishra17/Mafia-Boardgame-via-Agents']] },
    { t:'Big5-Agents', img:'ai_ml/big5.png',
      d:'The teamwork paper as runnable code. Six behaviours you can switch off one at a time to see which carry the result.',
      lk:[['Code','https://github.com/PranavMishra17/Big5-Agents']] },
    { t:'Neon-Bites', img:'game_design/neon.png',
      d:'Cyberpunk food delivery with the physics taken seriously. The city generates itself.',
      lk:[['Watch it run','https://youtu.be/PLVynmeGvsI']] },
    { t:'Rusty ANT', img:'game_design/rust.png',
      d:'Ants evolving, in a language that will not let you leak memory.',
      lk:[['Code','https://github.com/PranavMishra17/Rust-yy-Ant']] }
  ];

  function projGrid(){
    return '<div class="grid">' + PROJECTS.map(function(p){
      return '<article class="card">' +
        '<img src="'+IMG+p.img+'" alt="'+p.t+'" loading="lazy">' +
        '<div class="cap"><h4>'+p.t+(p.live?'<span class="live">live</span>':'')+'</h4>' +
        '<p>'+p.d+'</p><p class="lk">'+p.lk.map(function(l){
          return '<a href="'+l[1]+'" target="_blank" rel="noopener">'+l[0]+'</a>';
        }).join('')+'</p></div></article>';
    }).join('') + '</div>';
  }

  var THINGS = {
    'o-about': { title:'Who I am', hint:'a card on the sill', body:
      '<p>I am Pranav Pushkar Mishra. I build the parts of AI systems that have to be right, which usually means the unglamorous parts: what the thing is allowed to do, how fast it does it, and whether it is telling the truth.</p>' +
      '<p>Right now I am a founding LLM engineer at Alfred_ in New York, working on a consumer assistant that runs five thousand people\'s email, calendar and daily obligations over text message, chat and voice.</p>' +
      '<p>Before that, computer science at the University of Illinois Chicago, a research lab, and a lot of games and virtual worlds that taught me more about performance than any course did.</p>' +
      '<p class="q">Metuchen, New Jersey.</p>' +
      '<p class="lk"><a href="https://github.com/PranavMishra17" target="_blank" rel="noopener">GitHub</a> &nbsp;&nbsp; <a href="https://www.linkedin.com/in/pranavgamedev/" target="_blank" rel="noopener">LinkedIn</a> &nbsp;&nbsp; <a href="https://huggingface.co/Paranoiid" target="_blank" rel="noopener">Hugging Face</a></p>' },

    'o-work': { title:'Where I have worked', hint:'four badges on a hook', body:
      '<div class="entry"><h3>Founding LLM Engineer, Alfred_</h3><p class="when">New York City · April 2026 to now</p>' +
      '<p>A consumer AI assistant with five thousand subscribers in production. I own the reliability side of it.</p>' +
      '<p>I cut notification latency from about ninety seconds to three, and the security-code path from three minutes at the ninetieth percentile to instant. I replaced a model call on every message in the rules engine with a deterministic three-stage matcher, which took about thirty percent off the cost per user and still let ninety-eight percent of rules get created just by talking to it. And I rebuilt working memory so the assistant cannot invent a fact about your inbox, enforced by tests rather than by hoping.</p>' +
      '<p class="lk"><a href="https://get-alfred.ai/" target="_blank" rel="noopener">get-alfred.ai</a></p></div>' +

      '<div class="entry"><h3>AI Engineer, WheelPrice</h3><p class="when">Charlotte, remote · July 2025 to March 2026</p>' +
      '<p>Computer vision for automotive part fitment, and a content system in React and Node that took the site to ten or twenty thousand readers a day. I also shipped the OTP verification flow.</p></div>' +

      '<div class="entry"><h3>Research Software Engineer, V-ARE Labs at UIC</h3><p class="when">Chicago · February 2024 to now</p>' +
      '<p>Virtual patients in Unreal Engine, with a Python service behind them. Also an audio pipeline comparing feature engineering against CNNs and transformers, which landed at 98.52% accuracy with real-time inference.</p></div>' +

      '<div class="entry"><h3>Software Developer Intern, Bipolar Factory</h3><p class="when">Bengaluru · 2023</p>' +
      '<p>A streaming platform on the MERN stack with an AWS pipeline behind it, and in-game chat in Unity that moved retention about ten percent.</p></div>' },

    'o-built': { title:'Things I built', hint:'on the laptop', body:
      '<p>Nine of them. Two are live and you can go and use them right now.</p>' + projGrid() },

    'o-papers': { title:'Papers', hint:'the tray on the desk', body:
      '<div class="entry"><h3>A systematic framework for enterprise knowledge retrieval</h3>' +
      '<p class="when">Accepted at CAI 2026, IEEE</p>' +
      '<p>Retrieval gets better if you let a model write metadata about each chunk before you store it. Recursive chunking with weighted embeddings reached 82.5% precision, against 73.3% for the content alone.</p>' +
      '<p class="lk"><a href="https://arxiv.org/pdf/2512.05411" target="_blank" rel="noopener">Read it</a></p></div>' +

      '<div class="entry"><h3>TeamMedAgents</h3><p class="when">Under review at PAKDD 2026 · four citations</p>' +
      '<p>I took the Big Five teamwork model out of organisational psychology and built each part of it as a real mechanism between agents. Better on seven of eight medical benchmarks, and which configuration wins turns out to depend on the kind of reasoning the task needs.</p>' +
      '<p class="lk"><a href="https://arxiv.org/pdf/2508.08115" target="_blank" rel="noopener">Read it</a> &nbsp;&nbsp; <a href="https://github.com/PranavMishra17/Big5-Agents" target="_blank" rel="noopener">Code</a></p></div>' +

      '<div class="entry"><h3>Cost-efficient multi-modal medical reasoning with small models</h3><p class="when">In preparation</p>' +
      '<p>Whether several small models talking to each other can stand in for one large one on medical images, and what that trade actually costs.</p></div>' },

    'o-books': { title:'What I read and watch', hint:'the books at the desk edge', body:
      '<p>I read, I watch a lot of films, and I play games — which is not incidental to the work, since half of what I have built is a world of some kind.</p>' +
      '<div class="slots">' +
        '<div class="slot"><span>Reading</span><b>a book goes here</b></div>' +
        '<div class="slot"><span>Just finished</span><b>and here</b></div>' +
        '<div class="slot"><span>Film I keep returning to</span><b>and here</b></div>' +
        '<div class="slot"><span>Playing</span><b>and here</b></div>' +
      '</div>' +
      '<p class="note">Placeholders. I did not want to put opinions in your mouth, so these are empty on purpose — tell me the real ones and I will set them.</p>' },

    'o-shelf': { title:'Odds and ends', hint:'the small shelf', body:
      '<div class="entry"><h3>Won the MIT XR hackathon, 2024</h3>' +
      '<p>For SnAIder-Cut. Generative AI editing an augmented scene while you stand inside it.</p></div>' +
      '<div class="entry"><h3>First place, HINT 5.0</h3>' +
      '<p>For Virtual Van Gogh, a walkable museum with the paintings on a chain.</p></div>' +
      '<div class="entry"><h3>Four citations, and counting slowly</h3>' +
      '<p>On the teamwork paper. It is a small number and I am unreasonably pleased about it.</p></div>' +
      '<div class="entry"><h3>The thing I would put here if you let me</h3>' +
      '<p class="q">This is the drawer for whatever does not fit anywhere else. What is currently on your desk that should be on this shelf?</p></div>' }
  };

  /* ── the light. It advances as you pick things up, so the sky tells you
        how far through you are without a progress bar. ── */
  var SKY = [
    ['#8fb4d6','#cddcea','#efe3cf'],   // afternoon
    ['#7fa8cf','#c6d5e4','#f3dcc0'],
    ['#6f93bd','#c2b9c8','#f2c79c'],
    ['#4d6d97','#a08aa4','#ec9a6f'],
    ['#33486e','#6b5a80','#c96f57'],
    ['#20304f','#40395e','#7d4a45'],
    ['#141d33','#1e1e35','#3a2630']    // night
  ];
  var seen = {}, order = Object.keys(THINGS);
  var sun = document.getElementById('sun');
  var glow = document.getElementById('glow');
  var cone = document.getElementById('lampcone');
  var stops = [document.getElementById('s0'),document.getElementById('s1'),document.getElementById('s2')];

  function lerp(a,b,t){ return a+(b-a)*t; }
  function hx(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
  function mix(a,b,t){ var A=hx(a),B=hx(b); return 'rgb('+[0,1,2].map(function(i){return Math.round(lerp(A[i],B[i],t));}).join(',')+')'; }

  function setLight(){
    var n = Object.keys(seen).length;
    var t = Math.min(1, n / order.length);
    var f = t * (SKY.length - 1);
    var i = Math.min(SKY.length - 2, Math.floor(f));
    var k = f - i;
    for (var s=0;s<3;s++) stops[s].setAttribute('stop-color', mix(SKY[i][s], SKY[i+1][s], k));
    var sx = lerp(760, 300, t), sy = lerp(250, 452, t);
    sun.setAttribute('cx', sx); sun.setAttribute('cy', sy);
    glow.setAttribute('cx', sx); glow.setAttribute('cy', sy);
    sun.setAttribute('opacity', t > .92 ? 0 : 1);
    glow.setAttribute('opacity', Math.max(0, 1 - t*.7));
    cone.setAttribute('opacity', t > .55 ? Math.min(1,(t-.55)*2.6) : 0);
    /* The sky darkens, but the desk must not: the lamp comes on and the wall
       LIFTS, so the later you get the more light falls on the things you read. */
    var lift = t > .45 ? (t - .45) / .55 : 0;
    document.documentElement.style.setProperty('--wall', mix('#3b3630', '#59503f', lift));
    document.documentElement.style.setProperty('--desk', mix('#2b2620', '#4a4033', lift));
  }

  /* ── the sheet ── */
  var sheet = document.getElementById('sheet');
  var veil  = document.getElementById('veil');
  var titleEl = document.getElementById('sheetTitle');
  var bodyEl  = document.getElementById('sheetBody');
  var lastFocus = null;
  var shotIdx = 0;

  function open(id){
    var thing = THINGS[id]; if (!thing) return;
    lastFocus = document.activeElement;
    titleEl.textContent = thing.title;
    bodyEl.innerHTML = thing.body;
    bodyEl.scrollTop = 0;
    sheet.classList.add('on'); veil.classList.add('on');
    document.getElementById('shut').focus();

    if (!seen[id]){
      seen[id] = 1;
      var g = document.getElementById(id);
      if (g){ g.classList.add('seen'); var lb = g.querySelector('.label'); if (lb) lb.classList.add('done'); }
      var mb = document.querySelector('[data-mob="'+id+'"]');
      if (mb) mb.style.opacity = '.62';
      setLight();
    }
    if (!REDUCED){
      /* framer: { type:'spring', stiffness: 340, damping: 30, mass: 1.2 } */
      sheet.animate(
        [{transform:'translate(-50%,-46%) scale(.965)',opacity:0},
         {transform:'translate(-50%,-51%) scale(1.006)',opacity:1,offset:.6},
         {transform:'translate(-50%,-50%) scale(1)',opacity:1}],
        {duration:420,easing:'cubic-bezier(.2,.85,.25,1)'});
    }
    var h = document.getElementById('hint'); if (h) h.style.opacity = '0';
  }
  function close(){
    sheet.classList.remove('on'); veil.classList.remove('on');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  document.getElementById('shut').addEventListener('click', close);
  veil.addEventListener('click', close);
  addEventListener('keydown', function(e){ if (e.key === 'Escape' && sheet.classList.contains('on')) close(); });

  order.forEach(function(id){
    var g = document.getElementById(id);
    if (!g) return;
    g.addEventListener('click', function(){ open(id); });
    g.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(id); }
    });
  });

  /* small screens: an honest list, same content */
  var mobList = document.getElementById('mobList');
  order.forEach(function(id){
    var b = document.createElement('button');
    b.type = 'button'; b.setAttribute('data-mob', id);
    b.innerHTML = THINGS[id].title + '<span>' + THINGS[id].hint + '</span>';
    b.addEventListener('click', function(){ open(id); });
    mobList.appendChild(b);
  });

  /* the laptop cycles through what he made, slowly, so the screen is never dead */
  var shot = document.getElementById('screenShot');
  function nextShot(){
    shotIdx = (shotIdx + 1) % PROJECTS.length;
    shot.setAttribute('href', IMG + PROJECTS[shotIdx].img);
  }
  if (!REDUCED) setInterval(nextShot, 4200);

  setLight();
  setTimeout(setLight, 400);   /* never depends on rAF or load */
})();
</script>
</body>
</html>

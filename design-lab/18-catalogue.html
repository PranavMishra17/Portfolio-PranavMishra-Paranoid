<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Catalogue — Pranav Mishra</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..600;1,8..60,300..400&display=swap" rel="stylesheet">
<style>
:root{
  --case:#39423c;       /* the cabinet */
  --case-dark:#2c342f;
  --face:#ddd8c9;       /* a drawer front */
  --face-open:#efeadb;
  --plate:#1f2622;      /* typed ink */
  --brass:#ad8a54;
  --stock:#f4f0e6;      /* card stock */
  --stock-edge:#d8d1bf;
  --ink:#1d211f;
  --ink-soft:#5d635e;
  --deep:#33564c;
  --typed:'Cutive Mono',ui-monospace,monospace;
  --read:'Source Serif 4',Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--case-dark);color:var(--ink);
  font-family:var(--read);overflow:hidden;
}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
img{display:block;max-width:100%}

#room{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);height:100%}

/* ── the cabinet ─────────────────────────────────────────── */
#cab{
  background:var(--case);padding:clamp(18px,2.6vw,38px);
  overflow-y:auto;border-right:6px solid var(--case-dark);
}
.cabhead{margin-bottom:clamp(16px,2.4vw,26px);max-width:44ch}
.cabhead h1{
  font-family:var(--typed);font-size:clamp(15px,1.7vw,19px);font-weight:400;
  color:#e4dfd0;letter-spacing:.02em;
}
.cabhead p{font-size:14px;color:#a6ada4;line-height:1.5;margin-top:.45rem}

.bank{margin-bottom:clamp(14px,2vw,22px)}
.bank > .rule{
  display:flex;align-items:center;gap:10px;margin-bottom:8px;
  font-family:var(--typed);font-size:11.5px;color:#8d968c;letter-spacing:.06em;
}
.bank > .rule::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.13)}
.row{display:grid;gap:7px}

.dw{
  position:relative;background:var(--face);border-radius:1px;
  padding:9px 10px 10px;display:grid;grid-template-columns:1fr auto;
  align-items:center;gap:8px;
  box-shadow:0 2px 0 rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.55);
  transition:transform 260ms cubic-bezier(.2,.9,.25,1), background 200ms;
}
.dw:hover{background:var(--face-open)}
.dw .lab{
  font-family:var(--typed);font-size:12.5px;line-height:1.25;color:var(--plate);
  letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.dw .pull{
  width:22px;height:7px;border-radius:4px;background:var(--brass);
  box-shadow:inset 0 -1px 0 rgba(0,0,0,.3);flex:none;
}
.dw .stamp{
  position:absolute;left:8px;top:-7px;font-family:var(--typed);font-size:9.5px;
  color:var(--brass);opacity:0;transition:opacity 200ms;
}
.dw.seen .stamp{opacity:1}
.dw.seen .lab{color:#5f665f}
.dw.open{transform:translateX(14px);background:var(--face-open)}
.dw.open .pull{background:#d8b071}

/* ── the card you pulled ─────────────────────────────────── */
#read{background:var(--case-dark);display:flex;flex-direction:column;overflow:hidden}
#cardWrap{flex:1;overflow-y:auto;padding:clamp(18px,2.6vw,34px);overscroll-behavior:contain}
.card{
  background:var(--stock);border-radius:2px;padding:clamp(20px,2.8vw,30px);
  box-shadow:0 18px 44px rgba(0,0,0,.42);border-bottom:2px solid var(--stock-edge);
  min-height:100%;
}
.card .kind{font-family:var(--typed);font-size:11.5px;color:var(--ink-soft);letter-spacing:.05em;margin-bottom:.85rem}
.card h2{font-family:var(--read);font-weight:500;font-size:clamp(22px,2.6vw,29px);line-height:1.15;margin-bottom:.3rem}
.card .when{font-family:var(--typed);font-size:12px;color:var(--ink-soft);margin-bottom:1.05rem}
.card figure{margin:0 0 1.05rem}
.card figure img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:1px;background:#ddd7c8}
.card p{font-size:15.5px;line-height:1.62;max-width:62ch;margin-bottom:.8rem}
.card p:last-child{margin-bottom:0}
.card .lk{display:flex;gap:1.4rem;flex-wrap:wrap;margin-top:1.05rem}
.card .lk a{color:var(--deep);text-decoration:none;font-size:14px;border-bottom:1px solid rgba(51,86,76,.35);padding-bottom:1px}
.card .lk a:hover{border-bottom-color:var(--deep)}
.card .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px;margin:.3rem 0 .2rem}
.card .slot{border:1px dashed var(--stock-edge);border-radius:2px;padding:.6rem .7rem}
.card .slot span{display:block;font-family:var(--typed);font-size:10.5px;color:var(--ink-soft);margin-bottom:.15rem}
.card .slot b{font-weight:400;font-size:15px;color:#8c8778}
.card .note{font-size:13.5px;color:var(--ink-soft);font-style:italic}
.card .due{
  margin-top:1.4rem;padding-top:.7rem;border-top:1px solid var(--stock-edge);
  font-family:var(--typed);font-size:11px;color:#9a9488;
}

#empty{
  flex:1;display:grid;place-items:center;padding:34px;text-align:center;
}
#empty p{font-family:var(--typed);font-size:13px;color:#7f877e;line-height:1.7;max-width:30ch}

@media (max-width:900px){
  body{overflow:auto}
  #room{grid-template-columns:1fr;height:auto}
  #cab{overflow:visible;border-right:0;border-bottom:6px solid var(--case-dark)}
  #read{min-height:60vh}
  #cardWrap{padding:16px}
  .card{min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="room">
  <div id="cab">
    <div class="cabhead">
      <h1>MISHRA, PRANAV PUSHKAR — a catalogue</h1>
      <p>Twenty drawers. One thing in each. Pull whichever you like; they are not in any order that matters.</p>
    </div>
    <div id="banks"></div>
  </div>

  <div id="read">
    <div id="empty"><p>Pull a drawer.<br>The card comes out here.</p></div>
    <div id="cardWrap" hidden></div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var IMG = '/portfolio/public/assets/images/';

  /* Twenty drawers. Banked the way a catalogue is banked — different widths per
     bank, so this reads as a cabinet rather than as a grid of identical tiles. */
  var BANKS = [
    { rule:'THE PERSON', cols:'1fr', items:[
      { lab:'MISHRA, PRANAV PUSHKAR', kind:'Catalogue card', t:'Who this is about',
        when:'Metuchen, New Jersey',
        p:['I build the parts of AI systems that have to be right, which usually means the unglamorous parts: what the thing is allowed to do, how fast it does it, and whether it is telling the truth.',
           'Right now I am a founding LLM engineer at Alfred_ in New York, on a consumer assistant that runs five thousand people’s email, calendar and daily obligations over text message, chat and voice.',
           'Before that, computer science at the University of Illinois Chicago, a research lab, and a lot of games and virtual worlds that taught me more about performance than any course did.'],
        lk:[['GitHub','https://github.com/PranavMishra17'],['LinkedIn','https://www.linkedin.com/in/pranavgamedev/'],['Hugging Face','https://huggingface.co/Paranoiid']] }
    ]},

    { rule:'EMPLOYMENT', cols:'repeat(auto-fit,minmax(215px,1fr))', items:[
      { lab:'ALFRED_ · 2026–', kind:'Employment', t:'Founding LLM Engineer, Alfred_',
        when:'New York City · April 2026 to now',
        p:['A consumer AI assistant with five thousand subscribers in production. I own the reliability side of it.',
           'I cut notification latency from about ninety seconds to three, and the security-code path from three minutes at the ninetieth percentile to instant. I replaced a model call on every message in the rules engine with a deterministic three-stage matcher, which took roughly thirty percent off the cost per user and still lets ninety-eight percent of rules get made just by talking to it.',
           'And I rebuilt working memory so the assistant cannot invent a fact about your inbox — enforced by tests, not by hoping the model behaves.'],
        lk:[['get-alfred.ai','https://get-alfred.ai/']] },
      { lab:'WHEELPRICE · 2025–26', kind:'Employment', t:'AI Engineer, WheelPrice',
        when:'Charlotte, remote · July 2025 to March 2026',
        p:['Computer vision for automotive part fitment, built end to end in PyTorch.',
           'Also a content system in React and Node that took the site to ten or twenty thousand readers a day, and the OTP verification flow that shipped with it.'] },
      { lab:'V-ARE LABS, UIC · 2024–', kind:'Employment', t:'Research Software Engineer, V-ARE Labs',
        when:'Chicago · February 2024 to now',
        p:['Virtual patients in Unreal Engine with a Python service behind them, used by clinicians in real studies.',
           'Also an audio pipeline comparing feature engineering against CNNs and transformers, which landed at 98.52% accuracy with real-time inference and proper robustness testing.'] },
      { lab:'BIPOLAR FACTORY · 2023', kind:'Employment', t:'Software Developer Intern, Bipolar Factory',
        when:'Bengaluru · 2023',
        p:['A streaming platform on the MERN stack with an AWS and Jenkins pipeline behind it.',
           'And in-game chat in Unity, which moved retention about ten percent.'] }
    ]},

    { rule:'THINGS MADE', cols:'repeat(auto-fit,minmax(150px,1fr))', items:[
      { lab:'STELLARIUM', kind:'Thing made · 2024', t:'Stellarium', when:'Extended reality',
        img:'game_design/stellarium.png',
        p:['A hundred and seven thousand astronomical objects, rendered in CAVE2 — a room whose walls are screens.',
           'The astronomy was never the hard part. Holding real-time frame rates while that many objects are on screen and a person is physically turning their head is the hard part. Culling and GPU instancing did most of the work.'],
        lk:[['Watch it run','https://youtu.be/EX0c-6E8iNc']] },
      { lab:'SNAIDER-CUT', kind:'Thing made · 2024 · won MIT XR', t:'SnAIder-Cut', when:'Mixed reality',
        img:'game_design/snaider.png',
        p:['Say what you want changed, and the augmented room changes around you while you stand in it.',
           'Spatial mapping to read the room, gesture recognition to take the instruction, generation to make the change, and a rendering budget tight enough that none of it feels like waiting. It won the MIT XR hackathon in 2024.'],
        lk:[['Watch it run','https://youtu.be/CZtGmnGYKp8']] },
      { lab:'EQUITY', kind:'Thing made · 2024', t:'EQUITY', when:'Medical simulation',
        img:'game_design/equity.png',
        p:['A virtual patient in Unreal Engine 5, built so researchers can study how doctors treat people differently.',
           'A MetaHuman holding a conversation through a dialogue tree, with facial animation good enough that clinicians respond to it as a person.'],
        lk:[['Watch it run','https://youtu.be/WO2vVaD8WoE'],['Code','https://github.com/PranavMishra17/EQUITY-VirtualPatient-UE5']] },
      { lab:'VIRTUAL VAN GOGH', kind:'Thing made · 2023 · first at HINT 5.0', t:'Virtual Van Gogh', when:'Web3',
        img:'game_design/van%20gogh.jpg',
        p:['A museum you can walk through, where the paintings are on a chain.',
           'The interesting engineering was the pipeline between the chain and the engine — keeping ownership state and the walkable world agreeing with each other.'],
        lk:[['Watch it run','https://youtu.be/rz_NiIj-dic']] },
      { lab:'SNAKEAI-MLOPS ▸ live', kind:'Thing made · 2025 · live', t:'SnakeAI-MLOps', when:'Reinforcement learning',
        img:'ai_ml/snake.png',
        p:['Four ways of learning the same game, racing each other: Q-learning, DQN, PPO and actor-critic.',
           'Gameplay in C++ with SFML, training in PyTorch, inference back through LibTorch, and a pipeline that retrains and redeploys without me touching it. You can go and play it right now.'],
        lk:[['Play it','https://pranavmishra17.github.io/SnakeAI-MLOps/'],['Code','https://github.com/PranavMishra17/SnakeAI-MLOps']] },
      { lab:'AI MAFIA', kind:'Thing made · 2025', t:'AI Mafia', when:'Multi-agent systems',
        img:'game_design/mafia.png',
        p:['Language models playing a game about lying to each other.',
           'Every player is an agent with a personality and private information. Nobody scripted the betrayals — they come out of the reasoning.'],
        lk:[['Code','https://github.com/PranavMishra17/Mafia-Boardgame-via-Agents']] },
      { lab:'BIG5-AGENTS', kind:'Thing made · 2025', t:'Big5-Agents', when:'Research code',
        img:'ai_ml/big5.png',
        p:['The teamwork paper, as something you can actually run.',
           'Six behaviours out of organisational psychology, each built as a switchable mechanism, so you can turn them off one at a time and see which ones carry the result.'],
        lk:[['Code','https://github.com/PranavMishra17/Big5-Agents']] },
      { lab:'NEON-BITES', kind:'Thing made · 2023', t:'Neon-Bites', when:'Game',
        img:'game_design/neon.png',
        p:['Cyberpunk food delivery, with the physics taken seriously.',
           'The city generates itself and the driving has real weight. Resource management and progression on top, and a lot of profiling to keep frame rates flat across platforms.'],
        lk:[['Watch it run','https://youtu.be/PLVynmeGvsI']] },
      { lab:'RUSTY ANT', kind:'Thing made · 2024', t:'Rusty ANT', when:'Systems',
        img:'game_design/rust.png',
        p:['Ants, evolving, in a language that will not let you leak memory.',
           'A life simulation in Rust, mostly an excuse to live inside the ownership model for a while.'],
        lk:[['Code','https://github.com/PranavMishra17/Rust-yy-Ant']] }
    ]},

    { rule:'PAPERS', cols:'repeat(auto-fit,minmax(215px,1fr))', items:[
      { lab:'RETRIEVAL / METADATA ✱', kind:'Paper · accepted', t:'A systematic framework for enterprise knowledge retrieval',
        when:'CAI 2026, IEEE · accepted',
        p:['Retrieval gets better if you let a model write metadata about each chunk before you store it.',
           'Recursive chunking with weighted embeddings reached 82.5% precision, against 73.3% for the content alone. Naive chunking with prefix fusion took the best hit rate at 0.925.'],
        lk:[['Read it','https://arxiv.org/pdf/2512.05411'],['Code','https://github.com/PranavMishra17/Metadata-Enrichment-with-LLMs-for-RAGs-Internal-Knowledge-Retrieval']] },
      { lab:'TEAMMEDAGENTS', kind:'Paper · under review · 4 citations', t:'TeamMedAgents',
        when:'PAKDD 2026 · under review',
        p:['I took the Big Five teamwork model out of organisational psychology and built each component as a real mechanism between agents — leadership, mutual monitoring, shared mental models, closed-loop communication, orientation, trust.',
           'Better on seven of eight medical benchmarks. Which configuration wins turns out to depend on the kind of reasoning the task needs, which was the interesting result.'],
        lk:[['Read it','https://arxiv.org/pdf/2508.08115'],['Code','https://github.com/PranavMishra17/Big5-Agents']] },
      { lab:'SMALL MODELS / IMAGING', kind:'Paper · in preparation', t:'Cost-efficient multi-modal medical reasoning',
        when:'Manuscript',
        p:['Whether several small models talking to each other can stand in for one large one on medical images, and what that trade actually costs.'] }
    ]},

    { rule:'OFF THE CLOCK', cols:'repeat(auto-fit,minmax(215px,1fr))', items:[
      { lab:'BOOKS', kind:'Off the clock', t:'What I read', when:'Ongoing',
        p:['I read. Properly, not in the LinkedIn sense.'],
        slots:[['Reading now','a book goes here'],['Just finished','and here'],['The one I reread','and here']],
        note:'Placeholders. I did not want to put opinions in your mouth — tell me the real ones and I will set them.' },
      { lab:'FILM & GAMES', kind:'Off the clock', t:'What I watch and play', when:'Ongoing',
        p:['Half of what I have built is a world of some kind, so this is not really time off.'],
        slots:[['Film I keep returning to','a film goes here'],['Playing now','a game goes here'],['The one that made me want to build','and here']],
        note:'Same — placeholders, waiting on you.' }
    ]},

    { rule:'', cols:'minmax(0,240px)', items:[
      { lab:'—', kind:'Unlabelled drawer', t:'Odds and ends', when:'The drawer with no label on it',
        p:['Won the MIT XR hackathon in 2024, for SnAIder-Cut.',
           'First place at HINT 5.0, for the Van Gogh museum.',
           'Four citations on the teamwork paper. It is a small number and I am unreasonably pleased about it.',
           'Every cabinet has one drawer with nothing written on the front. This is that drawer, and it is the right place for whatever is currently on your desk that should be in here instead.'] }
    ]}
  ];

  var banksEl = document.getElementById('banks');
  var wrap = document.getElementById('cardWrap');
  var emptyEl = document.getElementById('empty');
  var all = [], openBtn = null;

  BANKS.forEach(function(bank){
    var sec = document.createElement('section');
    sec.className = 'bank';
    if (bank.rule) sec.innerHTML = '<p class="rule">' + bank.rule + '</p>';
    var row = document.createElement('div');
    row.className = 'row';
    row.style.gridTemplateColumns = bank.cols;
    bank.items.forEach(function(it){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'dw';
      b.innerHTML = '<span class="lab">' + it.lab + '</span><span class="pull" aria-hidden="true"></span>' +
                    '<span class="stamp" aria-hidden="true">read</span>';
      b.addEventListener('click', function(){ pull(b, it); });
      row.appendChild(b);
      all.push(b);
    });
    sec.appendChild(row);
    banksEl.appendChild(sec);
  });

  function stamp(){
    var d = new Date();
    var m = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][d.getMonth()];
    return String(d.getDate()).padStart(2,'0') + ' ' + m + ' ' + d.getFullYear();
  }

  function pull(btn, it){
    if (openBtn && openBtn !== btn) openBtn.classList.remove('open');
    btn.classList.add('open','seen');
    openBtn = btn;

    var html = '<article class="card">' +
      '<p class="kind">' + it.kind + '</p>' +
      '<h2>' + it.t + '</h2>' +
      (it.when ? '<p class="when">' + it.when + '</p>' : '') +
      (it.img ? '<figure><img src="' + IMG + it.img + '" alt="' + it.t + '"></figure>' : '') +
      it.p.map(function(x){ return '<p>' + x + '</p>'; }).join('') +
      (it.slots ? '<div class="slots">' + it.slots.map(function(s){
          return '<div class="slot"><span>' + s[0] + '</span><b>' + s[1] + '</b></div>';
        }).join('') + '</div>' : '') +
      (it.note ? '<p class="note">' + it.note + '</p>' : '') +
      (it.lk ? '<p class="lk">' + it.lk.map(function(l){
          return '<a href="' + l[1] + '" target="_blank" rel="noopener">' + l[0] + '</a>';
        }).join('') + '</p>' : '') +
      '<p class="due">card pulled ' + stamp() + '</p>' +
    '</article>';

    emptyEl.hidden = true;
    wrap.hidden = false;
    wrap.innerHTML = html;
    wrap.scrollTop = 0;

    if (!REDUCED){
      /* the card comes up out of the drawer and settles.
         framer: { type:'spring', stiffness: 330, damping: 29, mass: 1.25 } */
      wrap.firstChild.animate(
        [{transform:'translateY(24px)',opacity:0},
         {transform:'translateY(-4px)',opacity:1,offset:.62},
         {transform:'none',opacity:1}],
        {duration:420,easing:'cubic-bezier(.2,.85,.25,1)'});
    }
    if (window.matchMedia('(max-width:900px)').matches){
      document.getElementById('read').scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'start'});
    }
  }

  /* open the person's drawer so the reading side is never blank */
  pull(all[0], BANKS[0].items[0]);
})();
</script>
</body>
</html>

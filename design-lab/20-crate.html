<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Crate — Pranav Mishra</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380..600;1,9..144,380..500&family=Space+Grotesk:wght@400..600&family=Caveat:wght@500..600&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#ede7d9;        /* the shop, lit */
  --wall-shadow:#dcd4bf;
  --wood:#bb8449;        /* the crate's wood */
  --wood-lo:#8f5f31;
  --wood-hi:#d5a06a;
  --paper:#f6f0e2;       /* sleeve front stock */
  --paper-lo:#e6dcc3;
  --plate:#e7ddc3;       /* the mat behind a letterboxed image */
  --white-sleeve:#fbfaf5;/* the plain "in preparation" stock */
  --ink:#241f18;
  --ink-soft:#6b6252;
  --liner:#233a32;       /* liner-note back stock: deep, matte, high contrast */
  --liner-hi:#2c463c;
  --liner-ink:#f2ead8;
  --liner-soft:#b9c4bb;
  --brass:#a97f3c;
  --brass-lo:#8a672f;
  --oxblood:#8a3b34;
  --teal:#2c6459;
  --focus:#a97f3c;
  --sans:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
  --serif:'Fraunces','Iowan Old Style',Georgia,serif;
  --hand:'Caveat',cursive;
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:
    radial-gradient(ellipse 900px 500px at 50% -8%, rgba(255,252,240,.9), rgba(255,252,240,0) 60%),
    var(--wall);
  color:var(--ink);font-family:var(--serif);overflow:hidden;
}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
a{color:inherit}

/* ───────────────────────── layout ───────────────────────── */
#scene{
  height:100%;display:flex;flex-direction:column;align-items:center;
  padding:clamp(14px,2.4vw,30px) clamp(14px,3vw,30px) clamp(10px,2vw,20px);
  gap:0;
}

/* ── the header card: standing proud, in front of everything ── */
.about{
  position:relative;z-index:30;width:min(100%,760px);
  background:var(--paper);border-radius:3px;
  padding:clamp(16px,2.2vw,26px) clamp(20px,3vw,32px);
  box-shadow:0 20px 34px rgba(40,28,10,.28), 0 2px 0 var(--paper-lo);
  margin-bottom:clamp(-22px,-2.4vw,-16px); /* pulls the crate up underneath it */
}
.about h1{
  font-size:clamp(21px,2.6vw,28px);font-weight:600;letter-spacing:-.01em;
}
.about p{
  font-size:15.5px;line-height:1.6;max-width:62ch;color:#3a3226;margin-top:.5rem;
}
.about p+p{margin-top:.35rem}

/* ── the crate itself ── */
.crate{
  position:relative;flex:1;width:min(100%,1040px);min-height:0;
  display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(180deg,var(--wood-hi),var(--wood) 18%, var(--wood-lo));
  border-radius:8px;
  padding:clamp(30px,4.5vw,52px) clamp(16px,3vw,34px) clamp(14px,2vw,20px);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.25), inset 0 -18px 30px rgba(0,0,0,.28), 0 24px 40px rgba(40,28,10,.3);
  overflow:hidden;
}
.crate::before{ /* plank seams */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg, rgba(0,0,0,.07) 0 2px, transparent 2px 92px);
  opacity:.5;
}
.sticker{
  position:absolute;top:10px;left:14px;z-index:5;
  width:58px;height:58px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #dff0ea, var(--teal) 70%);
  color:#eafff9;font-family:var(--sans);font-weight:600;font-size:10.5px;line-height:1.15;
  display:flex;align-items:center;justify-content:center;text-align:center;
  transform:rotate(-11deg);box-shadow:0 3px 6px rgba(0,0,0,.35);
  border:2px dashed rgba(255,255,255,.55);
}

/* ── the flip-stack ── */
.stack{
  position:relative;flex:1;width:100%;min-height:0;
  display:flex;align-items:center;justify-content:center;
  perspective:1400px;touch-action:pan-y;
}
.slot{
  position:absolute;width:var(--sleeve,300px);height:var(--sleeve,300px);
  transform-style:preserve-3d;will-change:transform;
  transition:transform 560ms cubic-bezier(.22,1.4,.36,1), opacity 420ms ease;
  /* the fan-out of upcoming sleeves. framer equivalent for this shift:
     { type:'spring', stiffness: 260, damping: 20, mass: 1.1 } */
}
.slot[data-drag="1"]{transition:none}
.slot .flipper{
  position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform 640ms cubic-bezier(.24,1.5,.35,1);
  /* the flip has more mass than the fan-shift.
     framer equivalent: { type:'spring', stiffness: 200, damping: 19, mass: 1.5 } */
}
.slot.flipped .flipper{transform:rotateY(180deg)}
.card{
  position:absolute;inset:0;width:100%;height:100%;
  border-radius:5px;overflow:hidden;backface-visibility:hidden;
  box-shadow:0 16px 30px rgba(30,20,8,.35), 0 2px 0 rgba(0,0,0,.15);
  display:flex;flex-direction:column;text-align:left;
}
.card.back{transform:rotateY(180deg)}
.slot:not(.is-front) .card{cursor:pointer}
.slot.is-front .card.front{cursor:pointer}

/* front-face variants */
.card.front{background:var(--paper)}
.card.front.v-plain,.card.front.v-blank{background:var(--white-sleeve)}
.plate{flex:1 1 auto;min-height:0;background:var(--plate);display:flex;align-items:center;justify-content:center;overflow:hidden}
.plate img{width:100%;height:100%;object-fit:contain}
.plate.sq img{width:auto;height:auto;max-width:78%;max-height:78%} /* the one square cover: van gogh.jpg, never past ~78% of a 300–340px sleeve, i.e. well under 380px */
.titleband{flex:0 0 auto;padding:12px 14px 14px}
.titleband h3{font-size:clamp(16px,1.7vw,19px);font-weight:600;line-height:1.2}
.titleband .sub{font-family:var(--sans);font-size:12px;color:var(--ink-soft);margin-top:3px}
.kindline{font-family:var(--sans);font-size:11px;color:var(--ink-soft);padding:12px 14px 0}

.empty-swatch{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}
.empty-swatch .dash{
  width:78%;height:70%;border:1.5px dashed #b7ac91;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--sans);font-size:11.5px;color:#9c9276;text-align:center;padding:10px;
}

.sticker-live{
  position:absolute;top:8px;right:8px;z-index:4;width:52px;height:52px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#dff0ea,var(--teal) 72%);
  color:#eafff9;font-family:var(--sans);font-weight:600;font-size:11px;
  display:flex;align-items:center;justify-content:center;transform:rotate(9deg);
  box-shadow:0 3px 6px rgba(0,0,0,.35);border:2px dashed rgba(255,255,255,.5);
}
.wrap-sheen{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.45) 50%,transparent 62%);
}
.stamp{
  position:absolute;top:22%;left:50%;transform:translate(-50%,-50%) rotate(-9deg);
  border:3px solid var(--oxblood);color:var(--oxblood);border-radius:6px;
  font-family:var(--sans);font-weight:600;font-size:13px;letter-spacing:.04em;
  padding:5px 10px;background:rgba(255,255,255,.35);
}

/* liner notes: the back */
.card.back{background:var(--liner);color:var(--liner-ink);padding:16px 18px;overflow-y:auto}
.card.back .kind{font-family:var(--sans);font-size:11px;color:var(--liner-soft);margin-bottom:.3rem}
.card.back h3{font-family:var(--serif);font-size:clamp(17px,1.8vw,20px);font-weight:600;line-height:1.2;margin-bottom:.5rem}
.card.back p{font-size:15px;line-height:1.6;max-width:58ch;margin-bottom:.55rem;color:var(--liner-ink)}
.stats{display:flex;flex-direction:column;gap:6px;margin:.4rem 0 .7rem;padding:.6rem 0;border-top:1px solid rgba(242,234,216,.22);border-bottom:1px solid rgba(242,234,216,.22)}
.stats .row{display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.stats .row .l{font-family:var(--sans);font-size:11.5px;color:var(--liner-soft)}
.stats .row .v{font-family:var(--sans);font-size:16px;font-weight:600;color:#fff;text-align:right}
.linklist{display:flex;flex-wrap:wrap;gap:1rem;margin-top:.4rem}
.linklist a{font-family:var(--sans);font-size:13px;color:#dff0ea;text-decoration:underline;text-underline-offset:3px}
.linklist a:hover{color:#fff}

/* divider cards: raised tab, section header */
.card.divider{background:var(--paper-lo);align-items:stretch}
.divtab{
  position:absolute;top:-18px;left:16px;background:var(--brass);color:#2c1f0e;
  font-family:var(--sans);font-weight:600;font-size:12.5px;letter-spacing:.03em;
  padding:7px 14px 8px;border-radius:4px 4px 0 0;box-shadow:0 -2px 4px rgba(0,0,0,.2);
}
.divbody{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 18px;gap:.6rem}
.divbody .cap{font-size:15px;line-height:1.55;color:#3a3226;max-width:26ch}
.divbody .hand{font-family:var(--hand);font-size:22px;color:var(--oxblood);line-height:1.3;transform:rotate(-1.5deg)}

/* ── controls ── */
.hud{
  width:100%;max-width:640px;margin-top:14px;display:flex;flex-direction:column;gap:8px;align-items:center;
}
.hud .position{font-family:var(--sans);font-size:13px;color:#3a3226;text-align:center}
.hud .position b{font-weight:600;color:var(--ink)}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{
  font-family:var(--sans);font-size:13.5px;font-weight:500;color:#2c1f0e;
  background:var(--paper);border:1px solid var(--paper-lo);border-radius:20px;
  padding:9px 18px;box-shadow:0 2px 0 rgba(0,0,0,.15);transition:transform 140ms ease;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.btn.primary{background:var(--brass);color:#241608;border-color:var(--brass-lo)}
.ticks{display:flex;gap:4px;align-items:flex-end;flex-wrap:wrap;justify-content:center;max-width:100%;padding:2px}
.tick{width:7px;height:7px;border-radius:50%;background:var(--wall-shadow);border:0;transition:transform 160ms ease, background 160ms ease}
.tick.div{width:4px;height:14px;border-radius:2px;background:var(--brass-lo)}
.tick.now{background:var(--oxblood);transform:scale(1.5)}
.tick.div.now{background:var(--oxblood)}

/* ───────────────────────── mobile ───────────────────────── */
@media (max-width:760px){
  body{overflow:auto}
  #scene{height:auto;min-height:100%;padding:14px 12px 26px}
  .about{margin-bottom:-16px}
  .about p{max-width:none}
  .crate{width:100%;min-height:min(94vw,420px)}
  .stack{min-height:min(94vw,380px)}
}
@media (prefers-reduced-motion:reduce){
  .slot,.slot .flipper,.btn{transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div id="scene">

  <!-- ═══ ABOUT — the front-of-bin header card. Static markup: visible at
       first paint no matter what the script below does or how long it takes. ═══ -->
  <header class="about">
    <h1>Pranav Pushkar Mishra</h1>
    <p>Computer science out of the University of Illinois Chicago; now a founding LLM engineer at Alfred_, in New York City.</p>
    <p>Everything below is real, and it flips like a record sleeve — drag it, arrow-key it, or click whatever's peeking out from behind.</p>
  </header>

  <div class="crate" id="crate">
    <div class="sticker" aria-hidden="true">sorted,<br>mostly</div>
    <div class="stack" id="stack" role="group" aria-label="A crate of sleeves you can flip through"></div>
  </div>

  <div class="hud">
    <p class="position" id="posText" aria-live="polite"></p>
    <div class="controls">
      <button class="btn" id="btnPrev" type="button">Back</button>
      <button class="btn primary" id="btnFlip" type="button">Turn it over</button>
      <button class="btn" id="btnNext" type="button">Forward</button>
    </div>
    <div class="ticks" id="ticks" aria-hidden="true"></div>
  </div>

</div>

<script>
(function(){
  'use strict';
  var REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var IMG = '/portfolio/public/assets/images/';

  /* ============================= DATA =============================
     Six data models, six homes:
       about        -> the static header card above, standing proud of the crate
       experience   -> EXPERIENCE divider, 4 sleeves; fronts = company/dates/city,
                       backs = liner-note stat rows (the numbers, physically native)
       projects     -> WORK divider, 9 sleeves whose fronts are the real screenshots;
                       SnakeAI-MLOps (and Alfred_, above, under experience) get the
                       "live" sticker
       publications -> PAPERS divider, 3 sleeves; the accepted one is stamped through
                       its shrink-wrap, the in-prep one is a plain white sleeve
       interests    -> READING/WATCHING/PLAYING divider carrying a handwritten
                       placeholder note; the three sleeves behind it are visibly blank
       surprises    -> one sleeve misfiled inside WORK (front deliberately plain,
                       unlike its photo-fronted neighbours) plus a small sticker on
                       the crate's own side, found rather than announced
     ================================================================= */

  var SECTION_LABEL = { exp:'Experience', work:'Work', papers:'Papers', int:'Reading, watching, playing' };

  function div(section, label, caption, hand){
    return { type:'divider', section:section, label:label, caption:caption||'', hand:hand||'' };
  }
  function sleeve(o){ o.type='sleeve'; if(o.countable===undefined) o.countable=true; return o; }

  var CRATE = [

    div('exp','EXPERIENCE','Four stops, in order.'),

    sleeve({ section:'exp', title:'Alfred_', sub:'New York City, April 2026 to present', variant:'text', kind:'Employment',
      back:{ h:'Founding LLM Engineer, Alfred_',
        p:['A consumer AI assistant that runs email, calendar and daily obligations over text, chat and voice for more than five thousand subscribers in production.',
           'Rebuilt working memory so it can’t invent facts about your inbox — enforced by tests, not by hoping the model behaves. Built the eval harness and the scanner that reads live production failures, both from scratch.'],
        stats:[['Notify latency','~90s → ~3s'],['Security code, p90','189s → instant'],['Cost per user','~30% down'],['Rules made by chat','~98%']],
        links:[['get-alfred.ai','https://get-alfred.ai/']] },
      badge:'LIVE' }),

    sleeve({ section:'exp', title:'WheelPrice', sub:'Charlotte, North Carolina (remote), July 2025 to March 2026', variant:'text', kind:'Employment',
      back:{ h:'AI Engineer, WheelPrice',
        p:['Built the computer-vision pipeline that matches parts to wheels by fitment, and separately, the content system that grew the site’s own readership.'],
        stats:[['Daily readers','10,000 to 20,000']] } }),

    sleeve({ section:'exp', title:'V-ARE Labs, UIC', sub:'Chicago, February 2024 to present', variant:'text', kind:'Employment',
      back:{ h:'Research Software Engineer, V-ARE Labs',
        p:['Virtual patients in Unreal Engine 5 used in real clinical-training studies, and an audio machine-learning pipeline behind them.'],
        stats:[['Audio pipeline accuracy','98.52%']] } }),

    sleeve({ section:'exp', title:'Bipolar Factory', sub:'Bengaluru, 2023', variant:'text', kind:'Employment',
      back:{ h:'Software Developer Intern, Bipolar Factory',
        p:['A streaming platform on the MERN stack, and in-game chat for a Unity title.'] } }),

    div('work','WORK','Nine of the things he’s built. The backs are where the story is.'),

    sleeve({ section:'work', title:'Stellarium', sub:'Extended reality, 2024', variant:'photo', img:'game_design/stellarium.png', kind:'Thing made',
      back:{ h:'Stellarium', p:['107,000 objects from the night sky, rendered across every surface of CAVE2 — four walls and a floor, all of them screens.',
        'Turn around inside it and the sky turns with you.'] } }),

    sleeve({ section:'work', title:'SnAIder-Cut', sub:'Mixed reality, 2024', variant:'photo', img:'game_design/snaider.png', kind:'Thing made',
      back:{ h:'SnAIder-Cut', p:['You stand inside an augmented scene and describe what should change; generative AI edits the room around you while you’re still in it.'] } }),

    sleeve({ section:'work', title:'EQUITY', sub:'Medical simulation, 2024', variant:'photo', img:'game_design/equity.png', kind:'Thing made',
      back:{ h:'EQUITY', p:['A virtual patient built in Unreal Engine 5 so researchers can study how a doctor’s behavior shifts with who’s in front of them.'] } }),

    sleeve({ section:'work', title:'Virtual Van Gogh', sub:'Web3, 2023', variant:'photo', img:'game_design/van%20gogh.jpg', square:true, kind:'Thing made',
      back:{ h:'Virtual Van Gogh', p:['A walkable museum where the artwork itself lives on a chain — you’re not just viewing the paintings, you’re walking through their provenance.'] } }),

    sleeve({ section:'work', title:'Neon-Bites', sub:'Game, 2023', variant:'photo', img:'game_design/neon.png', kind:'Thing made',
      back:{ h:'Neon-Bites', p:['Cyberpunk food delivery that actually simulates its physics, so the driving has weight instead of just looking fast.'] } }),

    /* filed here by mistake — found, not announced. plain front, unlike its
       photo-fronted neighbours in WORK; that mismatch is the whole point. */
    sleeve({ section:'work', title:'Also, This', sub:'filed here, apparently', variant:'plain', kind:'', countable:false,
      back:{ h:'Also, This', p:['Two of the things upstream in this crate actually won something: SnAIder-Cut took first at the MIT XR hackathon in 2024, and Virtual Van Gogh placed first at HINT 5.0.',
        'The teamwork paper down in Papers has four citations already. Small number. He is unreasonably pleased about it.'] } }),

    sleeve({ section:'work', title:'AI Mafia', sub:'Multi-agent systems, 2025', variant:'photo', img:'game_design/mafia.png', kind:'Thing made',
      back:{ h:'AI Mafia', p:['A game about lying, played entirely by language models — each one holds a private role, and nobody scripted the betrayals.'] } }),

    sleeve({ section:'work', title:'Big5-Agents', sub:'Research code, 2025', variant:'photo', img:'ai_ml/big5.png', kind:'Thing made',
      back:{ h:'Big5-Agents', p:['The teamwork paper made runnable: the Big Five model from organizational psychology, rebuilt as mechanisms that agents actually use on each other.'] } }),

    sleeve({ section:'work', title:'SnakeAI-MLOps', sub:'Reinforcement learning, 2025', variant:'photo', img:'ai_ml/snake.png', kind:'Thing made', badge:'LIVE',
      back:{ h:'SnakeAI-MLOps', p:['Four different ways of learning to play the same game, set loose to race each other: Q-learning, DQN, PPO and actor-critic.',
        'It’s live — you can go watch them play right now.'], links:[['Play it','https://pranavmishra17.github.io/SnakeAI-MLOps/']] } }),

    sleeve({ section:'work', title:'Rusty ANT', sub:'Systems, 2024', variant:'photo', img:'game_design/rust.png', kind:'Thing made',
      back:{ h:'Rusty ANT', p:['A colony of ants, evolving generation over generation, written in a language that refuses to let the memory leak.'] } }),

    div('papers','PAPERS','Three papers, three different stages of done.'),

    sleeve({ section:'papers', title:'Enterprise knowledge retrieval', sub:'Accepted at CAI 2026, IEEE', variant:'accepted', kind:'Paper',
      back:{ h:'A systematic framework for enterprise knowledge retrieval',
        p:['Have a model write metadata for each chunk before it’s stored, instead of storing the raw text alone.'],
        stats:[['Precision, with metadata','82.5%'],['Precision, content alone','73.3%']],
        links:[['Read it','https://arxiv.org/pdf/2512.05411']] } }),

    sleeve({ section:'papers', title:'TeamMedAgents', sub:'Under review, PAKDD 2026', variant:'text', kind:'Paper',
      back:{ h:'TeamMedAgents',
        p:['Takes the Big Five teamwork model out of organizational psychology and gives each trait a real mechanism agents use on one another.',
           'Beats the baseline on seven of eight medical benchmarks. Four citations already, before it’s even through review.'],
        links:[['Read it','https://arxiv.org/pdf/2508.08115']] } }),

    sleeve({ section:'papers', title:'Small models, medical imaging', sub:'In preparation', variant:'plain', kind:'Paper',
      back:{ h:'Cost-efficient multi-modal medical reasoning with small models',
        p:['Whether a handful of small models, talking to each other, can stand in for one large one on medical images — and what that trade actually costs.'] } }),

    div('int','READING, WATCHING, PLAYING','', 'these are placeholders. swap them for the real ones later.'),

    sleeve({ section:'int', title:'Reading', sub:'a slot, waiting', variant:'blank', kind:'Off the clock',
      back:{ h:'Reading', p:['He reads books. He hasn’t told us which ones.'] } }),

    sleeve({ section:'int', title:'Watching', sub:'a slot, waiting', variant:'blank', kind:'Off the clock',
      back:{ h:'Watching', p:['He loves films. Also hasn’t said which.'] } }),

    sleeve({ section:'int', title:'Playing', sub:'a slot, waiting', variant:'blank', kind:'Off the clock',
      back:{ h:'Playing', p:['He loves games. Still hasn’t said which ones.'] } })
  ];

  /* ============================= RENDER ============================= */
  var stackEl = document.getElementById('stack');
  var posText = document.getElementById('posText');
  var ticksEl = document.getElementById('ticks');
  var btnPrev = document.getElementById('btnPrev');
  var btnNext = document.getElementById('btnNext');
  var btnFlip = document.getElementById('btnFlip');

  var idx = 0;
  var DEPTH = 4; /* current + 3 peeking behind */
  var slots = [];

  function buildCardHTML(entry){
    if (entry.type === 'divider'){
      var body = entry.hand
        ? '<p class="hand">' + entry.hand + '</p>'
        : '<p class="cap">' + entry.caption + '</p>';
      /* the tab sits OUTSIDE .card (which clips at its own edge for the
         photo sleeves) so it can stick up past the card's top edge */
      return '<span class="divtab">' + entry.label + '</span>' +
      '<div class="card front divider">' +
        '<div class="divbody">' + body + '</div>' +
      '</div>';
    }

    var v = entry.variant;
    var frontInner = '';
    if (v === 'photo'){
      frontInner =
        '<div class="plate' + (entry.square ? ' sq' : '') + '"><img src="' + IMG + entry.img + '" alt="' + entry.title + '"></div>' +
        '<div class="titleband"><h3>' + entry.title + '</h3><div class="sub">' + entry.sub + '</div></div>';
    } else if (v === 'blank'){
      frontInner =
        '<div class="empty-swatch"><div class="dash">empty slot</div></div>' +
        '<div class="titleband"><h3>' + entry.title + '</h3><div class="sub">' + entry.sub + '</div></div>';
    } else if (v === 'accepted'){
      frontInner =
        '<div class="kindline">' + entry.kind + '</div>' +
        '<div class="empty-swatch"><div class="stamp">ACCEPTED</div></div>' +
        '<div class="wrap-sheen"></div>' +
        '<div class="titleband"><h3>' + entry.title + '</h3><div class="sub">' + entry.sub + '</div></div>';
    } else { /* 'text' or 'plain' */
      frontInner =
        '<div class="kindline">' + (entry.kind||'') + '</div>' +
        '<div class="empty-swatch"></div>' +
        '<div class="titleband"><h3>' + entry.title + '</h3><div class="sub">' + entry.sub + '</div></div>';
    }

    var badge = entry.badge === 'LIVE' ? '<span class="sticker-live">LIVE</span>' : '';

    var b = entry.back;
    var statsHtml = b.stats ? '<div class="stats">' + b.stats.map(function(s){
      return '<div class="row"><span class="l">' + s[0] + '</span><span class="v">' + s[1] + '</span></div>';
    }).join('') + '</div>' : '';
    var linksHtml = b.links ? '<p class="linklist">' + b.links.map(function(l){
      return '<a href="' + l[1] + '" target="_blank" rel="noopener">' + l[0] + '</a>';
    }).join('') + '</p>' : '';

    return (
      '<div class="card front v-' + v + '">' + frontInner + badge + '</div>' +
      '<div class="card back">' +
        '<p class="kind">' + (entry.kind||'Liner notes') + '</p>' +
        '<h3>' + b.h + '</h3>' +
        b.p.map(function(x){ return '<p>' + x + '</p>'; }).join('') +
        statsHtml + linksHtml +
      '</div>'
    );
  }

  /* build DOM slots once; only re-bind transforms/content on navigation */
  for (var i = 0; i < DEPTH; i++){
    var slot = document.createElement('div');
    slot.className = 'slot';
    var flipper = document.createElement('div');
    flipper.className = 'flipper';
    slot.appendChild(flipper);
    stackEl.appendChild(slot);
    slots.push({ el:slot, flipper:flipper, entryIndex:-1, flippable:false });
  }

  function depthTransform(depth){
    /* the fanned recede — a person can see there is more behind the current sleeve */
    var steps = [
      'translate3d(0,0,0) rotateY(0deg) scale(1)',
      'translate3d(9%,-3%,-40px) rotateY(-11deg) scale(.94)',
      'translate3d(18%,-6%,-90px) rotateY(-17deg) scale(.88)',
      'translate3d(27%,-9%,-140px) rotateY(-21deg) scale(.82)'
    ];
    return steps[Math.min(depth, steps.length-1)];
  }
  function depthOpacity(depth){ return [1, .88, .55, .28][Math.min(depth,3)]; }
  function depthZ(depth){ return 40 - depth*10; }

  var flippedFront = false;

  function render(){
    var n = CRATE.length;
    for (var d = 0; d < DEPTH; d++){
      var ei = Math.min(idx + d, n - 1);
      var entry = CRATE[ei];
      var s = slots[d];
      if (s.entryIndex !== ei){
        s.flipper.innerHTML = buildCardHTML(entry);
        s.entryIndex = ei;
      }
      s.el.style.transform = depthTransform(d);
      s.el.style.opacity = depthOpacity(d);
      s.el.style.zIndex = depthZ(d);
      s.el.classList.toggle('is-front', d === 0);
      s.el.classList.toggle('flipped', d === 0 && flippedFront);
      s.flippable = (d === 0 && entry.type === 'sleeve');

      /* rebuild click handler for this physical slot node each render */
      s.el.onclick = (function(depthAtBind, entryAtBind){
        return function(ev){
          if (ev.target.closest('a')) return; /* let real links through */
          if (depthAtBind === 0){
            if (entryAtBind.type === 'sleeve') toggleFlip();
            else goTo(idx + 1); /* dividers just pass you through */
          } else {
            goTo(idx + depthAtBind);
          }
        };
      })(d, entry);

      s.el.setAttribute('role','button');
      s.el.setAttribute('tabindex', d === 0 ? '0' : '-1');
      s.el.setAttribute('aria-label', d === 0
        ? (entry.type==='sleeve' ? 'Current: ' + entry.title + '. Press Enter to turn it over.' : entry.label)
        : 'Jump to ' + (entry.type==='sleeve' ? entry.title : entry.label));
    }

    btnFlip.hidden = CRATE[idx].type !== 'sleeve';
    btnPrev.disabled = idx === 0;
    btnNext.disabled = idx === n - 1;

    var entry = CRATE[idx];
    if (entry.type === 'divider'){
      posText.innerHTML = '<b>' + entry.label + '</b>';
    } else if (entry.countable === false){
      posText.textContent = SECTION_LABEL[entry.section] + ', filed off the count';
    } else {
      var same = CRATE.filter(function(e){ return e.type==='sleeve' && e.section===entry.section && e.countable!==false; });
      var rank = same.indexOf(entry) + 1;
      posText.innerHTML = SECTION_LABEL[entry.section] + ': <b>' + rank + ' of ' + same.length + '</b>';
    }

    renderTicks();
  }

  function renderTicks(){
    ticksEl.innerHTML = '';
    CRATE.forEach(function(entry, i){
      var t = document.createElement('button');
      t.type = 'button';
      t.className = 'tick' + (entry.type==='divider' ? ' div' : '') + (i===idx ? ' now' : '');
      t.setAttribute('aria-label', 'Go to ' + (entry.type==='sleeve' ? entry.title : entry.label));
      t.addEventListener('click', function(){ goTo(i); });
      ticksEl.appendChild(t);
    });
  }

  function goTo(newIdx){
    newIdx = Math.max(0, Math.min(CRATE.length - 1, newIdx));
    if (newIdx === idx) return;
    idx = newIdx;
    flippedFront = false;
    render();
  }
  function goNext(){ goTo(idx + 1); }
  function goPrev(){ goTo(idx - 1); }
  function toggleFlip(){
    flippedFront = !flippedFront;
    slots[0].el.classList.toggle('flipped', flippedFront);
  }

  btnPrev.addEventListener('click', goPrev);
  btnNext.addEventListener('click', goNext);
  btnFlip.addEventListener('click', toggleFlip);

  /* ============================= INPUT ============================= */

  /* keyboard: arrow keys move through the crate from anywhere on the page */
  window.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight'){ e.preventDefault(); goNext(); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); goPrev(); }
  });

  /* wheel: only inside the crate, only to browse — and never when the pointer
     is over a scrollable liner-notes panel that still has room to scroll */
  var wheelLock = false, wheelAccum = 0;
  stackEl.addEventListener('wheel', function(e){
    var overBack = e.target.closest('.card.back');
    if (overBack && overBack.scrollHeight > overBack.clientHeight + 2) return; /* let it scroll */
    e.preventDefault();
    if (wheelLock) return;
    wheelAccum += e.deltaY;
    if (Math.abs(wheelAccum) > 45){
      if (wheelAccum > 0) goNext(); else goPrev();
      wheelAccum = 0;
      wheelLock = true;
      setTimeout(function(){ wheelLock = false; }, 260);
    }
  }, { passive:false });

  /* drag / touch swipe on the front sleeve */
  var dragging = false, dragStartX = 0, dragDX = 0;
  var front = null;

  stackEl.addEventListener('pointerdown', function(e){
    if (!e.target.closest('.slot.is-front')) return;
    dragging = true; dragStartX = e.clientX; dragDX = 0;
    front = slots[0].el;
    front.setAttribute('data-drag','1');
    front.setPointerCapture && front.setPointerCapture(e.pointerId);
  });
  stackEl.addEventListener('pointermove', function(e){
    if (!dragging) return;
    dragDX = e.clientX - dragStartX;
    var clamped = Math.max(-140, Math.min(140, dragDX));
    front.style.transform = 'translate3d(' + clamped + 'px,0,0) rotateY(' + (clamped/-14) + 'deg)';
  });
  function endDrag(){
    if (!dragging) return;
    dragging = false;
    front.removeAttribute('data-drag');
    front.style.transform = '';
    if (dragDX < -70) goNext();
    else if (dragDX > 70) goPrev();
    dragDX = 0;
  }
  stackEl.addEventListener('pointerup', endDrag);
  stackEl.addEventListener('pointercancel', endDrag);
  stackEl.addEventListener('pointerleave', function(){ if (dragging) endDrag(); });

  /* size the sleeve to the viewport, kept as a CSS var so every transform
     computed above stays proportional at any width */
  function sizeSleeve(){
    var w = window.innerWidth;
    var px = w <= 760 ? Math.min(300, w*0.72) : Math.min(340, w*0.24);
    document.documentElement.style.setProperty('--sleeve', px + 'px');
  }
  sizeSleeve();
  window.addEventListener('resize', sizeSleeve);

  /* first paint: render synchronously, no rAF/load/IntersectionObserver gate */
  render();
})();
</script>
</body>
</html>

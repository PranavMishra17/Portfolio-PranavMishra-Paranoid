<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1560" width="1440" height="1560" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>Portfolio blueprint — four scroll sections, ending in the room</title>

  <defs>
    <linearGradient id="dayrun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#dcecf7"/>
      <stop offset="30%"  stop-color="#eef3f2"/>
      <stop offset="62%"  stop-color="#f6e6cd"/>
      <stop offset="100%" stop-color="#e9c39c"/>
    </linearGradient>
    <linearGradient id="paneSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2d9a8"/><stop offset="100%" stop-color="#e6b98a"/>
    </linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#5d6b74"/>
    </marker>
  </defs>

  <rect width="1440" height="1560" fill="#fbfaf7"/>

  <!-- ══════════ PANEL A — the scroll ══════════ -->
  <text x="56" y="52" font-size="19" font-weight="600" fill="#1d2529">A. The whole page — four screens, no more</text>
  <text x="56" y="76" font-size="13.5" fill="#5d6b74">One sky runs the full length: bright at the top, through noon, into sunset. The room is the last screen.</text>

  <rect x="56" y="96" width="300" height="420" rx="3" fill="url(#dayrun)" stroke="#c3ccd1"/>
  <text x="70" y="122" font-size="12" font-weight="600" fill="#2b3439">ONE CONTINUOUS SKY</text>
  <text x="70" y="142" font-size="11.5" fill="#4a565d">scroll position drives it</text>
  <text x="70" y="190" font-size="11.5" fill="#4a565d">sunrise</text>
  <text x="70" y="290" font-size="11.5" fill="#4a565d">noon</text>
  <text x="70" y="390" font-size="11.5" fill="#4a565d">late</text>
  <text x="70" y="480" font-size="11.5" fill="#4a565d">sunset</text>
  <line x1="330" y1="120" x2="330" y2="496" stroke="#5d6b74" stroke-width="1.4" marker-end="url(#ar)"/>

  <g font-size="13">
    <!-- section 1 -->
    <rect x="400" y="96" width="980" height="96" rx="3" fill="#ffffff" stroke="#c3ccd1"/>
    <text x="418" y="124" font-size="14.5" font-weight="600" fill="#1d2529">1 · Arrival</text>
    <text x="418" y="146" fill="#4a565d">Name. One or two plain sentences. The brightest part of the day.</text>
    <text x="418" y="166" fill="#8a949a">Nothing else. This screen is mostly sky.</text>

    <!-- section 2 -->
    <rect x="400" y="204" width="980" height="118" rx="3" fill="#ffffff" stroke="#c3ccd1"/>
    <text x="418" y="232" font-size="14.5" font-weight="600" fill="#1d2529">2 · The work</text>
    <text x="418" y="254" fill="#4a565d">Alfred_ and what changed there. Work history lives here too, compact — it must not eat the screen.</text>
    <text x="418" y="276" fill="#4a565d">Style reference: Ikeda's measurement register (33) — the way it lays data out, not its numbers.</text>
    <text x="418" y="298" fill="#8a949a">Left rail selects sections, name always visible — Rams (29) / Bass (32).</text>

    <!-- section 3 -->
    <rect x="400" y="334" width="980" height="140" rx="3" fill="#ffffff" stroke="#c3ccd1"/>
    <text x="418" y="362" font-size="14.5" font-weight="600" fill="#1d2529">3 · Things I built &amp; papers</text>
    <text x="418" y="384" fill="#4a565d">FIVE to EIGHT projects only. Never all of them. Static grid, reveal on hover — Ikeda (33) §4.</text>
    <text x="418" y="406" fill="#4a565d">“See everything” opens an overlay: the full set, with tag filters (ML · game · agents · XR · research).</text>
    <text x="418" y="428" fill="#4a565d">Tags, not a search box. Papers are filterable in the same overlay.</text>
    <text x="418" y="452" fill="#8a949a">Three papers sit here too, quiet, with their status.</text>

    <!-- section 4 -->
    <rect x="400" y="486" width="980" height="30" rx="3" fill="#f0e2cd" stroke="#c9a97f"/>
    <text x="418" y="506" font-size="14.5" font-weight="600" fill="#5a4526">4 · The room  →  see panel B</text>
  </g>

  <line x1="56" y1="556" x2="1384" y2="556" stroke="#dfe4e6"/>

  <!-- ══════════ PANEL B — the room ══════════ -->
  <text x="56" y="596" font-size="19" font-weight="600" fill="#1d2529">B. The room — the last screen, one scene, everything hoverable</text>
  <text x="56" y="620" font-size="13.5" fill="#5d6b74">His desk setup from his bachelor days. Seen flat, straight on. Hover names a thing; click opens what is written about it.</text>

  <!-- wall -->
  <rect x="56" y="644" width="1030" height="620" fill="#efece4" stroke="#c3ccd1"/>
  <!-- floor line -->
  <line x1="56" y1="1140" x2="1086" y2="1140" stroke="#9aa4aa" stroke-width="2"/>
  <rect x="56" y="1140" width="1030" height="124" fill="#e4ded2"/>

  <!-- 1 window -->
  <rect x="96" y="684" width="252" height="196" fill="url(#paneSky)" stroke="#6b7378" stroke-width="3"/>
  <line x1="222" y1="684" x2="222" y2="880" stroke="#6b7378" stroke-width="3"/>
  <line x1="96" y1="782" x2="348" y2="782" stroke="#6b7378" stroke-width="3"/>
  <circle cx="290" cy="742" r="20" fill="#fff3d6"/>
  <circle cx="16" cy="0" r="0" fill="none"/>
  <text x="96" y="906" font-size="12.5" font-weight="600" fill="#2b3439">1 · WINDOW</text>
  <text x="96" y="924" font-size="11.5" fill="#5d6b74">the sky system, one day later</text>

  <!-- 2 movie posters -->
  <g stroke="#6b7378" stroke-width="2" fill="#f7f4ec">
    <rect x="408" y="676" width="92" height="128"/>
    <rect x="512" y="676" width="92" height="128"/>
    <rect x="616" y="676" width="92" height="128"/>
    <rect x="720" y="676" width="92" height="128"/>
  </g>
  <text x="408" y="828" font-size="12.5" font-weight="600" fill="#2b3439">2 · MOVIE POSTERS</text>
  <text x="408" y="846" font-size="11.5" fill="#5d6b74">why each one is a favourite</text>

  <!-- 9 projects screen (wall mounted, right) -->
  <rect x="866" y="676" width="184" height="120" rx="3" fill="#20262a" stroke="#6b7378" stroke-width="2"/>
  <g stroke="#7d8a90" stroke-width="2">
    <line x1="886" y1="704" x2="1000" y2="704"/><line x1="886" y1="724" x2="978" y2="724"/>
    <line x1="886" y1="744" x2="1006" y2="744"/>
  </g>
  <text x="866" y="820" font-size="12.5" font-weight="600" fill="#2b3439">9 · PROJECTS SCREEN</text>
  <text x="866" y="838" font-size="11.5" fill="#5d6b74">top few + open the full set</text>

  <!-- 5 trophies on top of shelf -->
  <g fill="#c2924a" stroke="#8a6a34" stroke-width="1.5">
    <path d="M404 946 q0 -26 20 -26 q20 0 20 26 z"/>
    <rect x="416" y="946" width="16" height="12"/>
    <circle cx="472" cy="938" r="12"/>
  </g>
  <text x="398" y="984" font-size="12.5" font-weight="600" fill="#2b3439">5 · TROPHIES</text>
  <text x="398" y="1002" font-size="11.5" fill="#5d6b74">MIT XR 2024 · HINT 5.0</text>

  <!-- 4 bookshelf -->
  <rect x="96" y="966" width="240" height="174" fill="#f7f4ec" stroke="#6b7378" stroke-width="2"/>
  <g stroke="#6b7378" stroke-width="1.6" fill="#e2dccf">
    <rect x="112" y="984" width="20" height="140"/><rect x="138" y="992" width="16" height="132"/>
    <rect x="160" y="980" width="22" height="144"/><rect x="188" y="996" width="15" height="128"/>
    <rect x="209" y="986" width="19" height="138"/><rect x="234" y="994" width="17" height="130"/>
    <rect x="257" y="982" width="21" height="142"/>
  </g>
  <text x="96" y="1166" font-size="12.5" font-weight="600" fill="#2b3439">4 · BOOKSHELF</text>
  <text x="96" y="1184" font-size="11.5" fill="#5d6b74">reading now / recently finished</text>

  <!-- 3 fridge + magnets -->
  <rect x="880" y="880" width="170" height="240" rx="4" fill="#f2f1ec" stroke="#6b7378" stroke-width="2"/>
  <line x1="880" y1="962" x2="1050" y2="962" stroke="#6b7378" stroke-width="2"/>
  <g fill="#c96a5a">
    <circle cx="912" cy="1000" r="8"/><circle cx="952" cy="1022" r="8"/><circle cx="998" cy="996" r="8"/>
    <circle cx="930" cy="1058" r="8"/><circle cx="1006" cy="1054" r="8"/><circle cx="968" cy="1086" r="8"/>
  </g>
  <text x="880" y="1146" font-size="12.5" font-weight="600" fill="#2b3439">3 · FRIDGE MAGNETS</text>
  <text x="880" y="1164" font-size="11.5" fill="#5d6b74">a memory behind each one</text>

  <!-- desk -->
  <rect x="392" y="1052" width="440" height="14" fill="#b99a72" stroke="#6b7378" stroke-width="2"/>
  <line x1="424" y1="1066" x2="424" y2="1140" stroke="#6b7378" stroke-width="3"/>
  <line x1="800" y1="1066" x2="800" y2="1140" stroke="#6b7378" stroke-width="3"/>

  <!-- 6 monitor work exp -->
  <rect x="410" y="944" width="150" height="98" rx="3" fill="#20262a" stroke="#6b7378" stroke-width="2"/>
  <g fill="#7d8a90"><rect x="428" y="962" width="26" height="26"/><rect x="464" y="962" width="26" height="26"/><rect x="428" y="998" width="26" height="26"/></g>
  <text x="392" y="1092" font-size="12.5" font-weight="600" fill="#2b3439">6 · MONITOR — WORK</text>

  <!-- 7 monitor papers -->
  <rect x="580" y="944" width="150" height="98" rx="3" fill="#20262a" stroke="#6b7378" stroke-width="2"/>
  <g fill="#e8e3d6"><rect x="600" y="962" width="34" height="44"/><rect x="642" y="962" width="34" height="44"/><rect x="684" y="962" width="34" height="44"/></g>
  <text x="580" y="1092" font-size="12.5" font-weight="600" fill="#2b3439">7 · MONITOR — PAPERS</text>

  <!-- 8 laptop -->
  <path d="M470 1020 L560 1020 L572 1052 L458 1052 Z" fill="#2b3439" stroke="#6b7378" stroke-width="2"/>
  <text x="452" y="1114" font-size="12.5" font-weight="600" fill="#2b3439">8 · LAPTOP — ABOUT ME</text>

  <!-- 11 family photo -->
  <rect x="742" y="1000" width="54" height="44" fill="#f7f4ec" stroke="#6b7378" stroke-width="2"/>
  <circle cx="762" cy="1018" r="7" fill="#c3ccd1"/><circle cx="778" cy="1020" r="6" fill="#c3ccd1"/>
  <text x="700" y="1114" font-size="12.5" font-weight="600" fill="#2b3439">11 · FAMILY PHOTO</text>
  <text x="700" y="1132" font-size="11.5" fill="#5d6b74">where I come from</text>

  <!-- 10 games shelf -->
  <rect x="880" y="700" width="0" height="0"/>
  <g stroke="#6b7378" stroke-width="1.6" fill="#e2dccf">
    <rect x="880" y="838" width="16" height="34"/><rect x="900" y="838" width="16" height="34"/>
    <rect x="920" y="838" width="16" height="34"/><rect x="940" y="838" width="16" height="34"/>
  </g>
  <text x="880" y="892" font-size="12.5" font-weight="600" fill="#2b3439">10 · GAMES I PLAY</text>

  <!-- 12 football + boots -->
  <circle cx="150" cy="1206" r="30" fill="#f7f4ec" stroke="#2b3439" stroke-width="2"/>
  <path d="M150 1176 l14 22 l-14 18 l-14 -18 z" fill="#2b3439"/>
  <path d="M206 1220 q26 -20 52 -6 q16 8 12 20 l-64 0 z" fill="#e2dccf" stroke="#2b3439" stroke-width="2"/>
  <text x="120" y="1256" font-size="12.5" font-weight="600" fill="#2b3439">12 · FOOTBALL &amp; BOOTS</text>

  <!-- legend -->
  <rect x="1112" y="644" width="272" height="620" rx="3" fill="#ffffff" stroke="#c3ccd1"/>
  <text x="1132" y="676" font-size="14" font-weight="600" fill="#1d2529">What each thing opens</text>
  <g font-size="12" fill="#39434a">
    <text x="1132" y="710">1 · window — the sky, next morning</text>
    <text x="1132" y="742">2 · posters — films, and why</text>
    <text x="1132" y="774">3 · magnets — small memories</text>
    <text x="1132" y="806">4 · shelf — books, now / recent</text>
    <text x="1132" y="838">5 · trophies — the two wins</text>
    <text x="1132" y="870">6 · monitor — work history</text>
    <text x="1132" y="902">7 · monitor — the three papers</text>
    <text x="1132" y="934">8 · laptop — about me</text>
    <text x="1132" y="966">9 · screen — projects</text>
    <text x="1132" y="998">10 · shelf — games he plays</text>
    <text x="1132" y="1030">11 · photo — where he is from</text>
    <text x="1132" y="1062">12 · ball — he used to play</text>
  </g>
  <line x1="1132" y1="1092" x2="1364" y2="1092" stroke="#dfe4e6"/>
  <text x="1132" y="1120" font-size="12" font-weight="600" fill="#1d2529">Rule</text>
  <text x="1132" y="1144" font-size="12" fill="#5d6b74">6, 7, 8 and 9 reuse the exact</text>
  <text x="1132" y="1164" font-size="12" fill="#5d6b74">content from sections 2 and 3.</text>
  <text x="1132" y="1184" font-size="12" fill="#5d6b74">Nothing is written twice.</text>
  <text x="1132" y="1222" font-size="12" fill="#5d6b74">Everything else here is personal,</text>
  <text x="1132" y="1242" font-size="12" fill="#5d6b74">and appears nowhere else.</text>

  <text x="56" y="1320" font-size="12.5" fill="#8a949a">Formalised from Pranav's hand sketch, 2026-09-09. Positions are indicative; the inventory and the hover/click behaviour are the spec.</text>
</svg>
